<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>EON</title>

<style>

/* =========================================================
   ROOT
========================================================= */

:root {

    --gold: #ffd21f;
    --gold-soft: #fff09a;
    --gold-deep: #ffae00;

    --red: #ff2525;
    --red-soft: #ff7070;

    --bg: #000000;

    --text: #f5f5f5;

    --core: var(--gold);

    --glow:
        0 0 10px var(--core),
        0 0 30px var(--core),
        0 0 70px var(--core);

}


/* =========================================================
   RESET
========================================================= */

* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

}


html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* =========================================================
   BODY
========================================================= */

body {

    position: relative;

    display: flex;

    justify-content: center;

    align-items: center;

    transition:
        background 0.6s ease;

}


/* =========================================================
   BACKGROUND
========================================================= */

.background {

    position: fixed;

    inset: 0;

    background:

        radial-gradient(
            circle at 50% 50%,
            rgba(255, 205, 30, 0.10),
            transparent 24%
        ),

        radial-gradient(
            circle at 50% 50%,
            rgba(255, 170, 0, 0.05),
            transparent 48%
        ),

        #000;

    transition:
        background 0.7s ease;

}


body.unlimited .background {

    background:

        radial-gradient(
            circle at 50% 50%,
            rgba(255, 0, 0, 0.12),
            transparent 25%
        ),

        radial-gradient(
            circle at 50% 50%,
            rgba(255, 0, 0, 0.05),
            transparent 50%
        ),

        #000;

}


/* =========================================================
   STAR FIELD
========================================================= */

.stars {

    position: fixed;

    inset: 0;

    pointer-events: none;

    opacity: 0.7;

}


.star {

    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: var(--core);

    box-shadow:
        0 0 6px var(--core);

    animation:
        starMove
        var(--duration)
        linear
        infinite;

}


@keyframes starMove {

    0% {

        transform:
            translateY(0)
            scale(0.5);

        opacity: 0;

    }

    30% {

        opacity: 1;

    }

    70% {

        opacity: 1;

    }

    100% {

        transform:
            translateY(-120px)
            scale(1.4);

        opacity: 0;

    }

}


/* =========================================================
   MAIN
========================================================= */

.interface {

    position: relative;

    z-index: 5;

    width: 100%;

    height: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

}


/* =========================================================
   TOP TITLE
========================================================= */

.logo {

    position: absolute;

    top: 28px;

    left: 50%;

    transform:
        translateX(-50%);

    font-size:
        clamp(38px, 5vw, 70px);

    font-weight: 300;

    letter-spacing:
        clamp(12px, 2vw, 22px);

    color: var(--core);

    text-shadow: var(--glow);

    transition:
        color 0.5s ease,
        text-shadow 0.5s ease;

    animation:
        logoPulse
        3s
        ease-in-out
        infinite;

}


@keyframes logoPulse {

    0%,
    100% {

        opacity: 0.82;

    }

    50% {

        opacity: 1;

    }

}


/* =========================================================
   CONNECTION
========================================================= */

.connection {

    position: absolute;

    top: 35px;

    right: 38px;

    display: flex;

    align-items: center;

    gap: 9px;

    font-size: 10px;

    letter-spacing: 2px;

    color: rgba(255,255,255,0.55);

}


.connection-dot {

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: var(--core);

    box-shadow:
        0 0 10px var(--core);

    animation:
        connectionPulse
        1.5s
        ease-in-out
        infinite;

}


@keyframes connectionPulse {

    0%,
    100% {

        transform: scale(0.8);

        opacity: 0.5;

    }

    50% {

        transform: scale(1.2);

        opacity: 1;

    }

}


/* =========================================================
   CORE CONTAINER
========================================================= */

.core-container {

    position: relative;

    width:
        min(570px, 75vw);

    height:
        min(570px, 75vw);

    display: flex;

    align-items: center;

    justify-content: center;

}


/* =========================================================
   OUTER AURA
========================================================= */

.aura {

    position: absolute;

    width: 100%;
    height: 100%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            transparent 43%,
            rgba(255,210,30,0.025) 55%,
            transparent 72%
        );

    filter: blur(5px);

    animation:
        auraPulse
        3s
        ease-in-out
        infinite;

}


@keyframes auraPulse {

    0%,
    100% {

        transform: scale(0.94);

        opacity: 0.5;

    }

    50% {

        transform: scale(1.08);

        opacity: 1;

    }

}


/* =========================================================
   ORBIT RINGS
========================================================= */

.orbit {

    position: absolute;

    border-radius: 50%;

    border:
        1px solid var(--core);

    box-shadow:
        0 0 12px var(--core);

    opacity: 0.45;

}


.orbit.one {

    width: 100%;
    height: 48%;

    transform:
        rotate(25deg);

    animation:
        orbitOne
        9s
        linear
        infinite;

}


.orbit.two {

    width: 110%;
    height: 55%;

    transform:
        rotate(-35deg);

    opacity: 0.25;

    animation:
        orbitTwo
        13s
        linear
        infinite;

}


.orbit.three {

    width: 125%;
    height: 68%;

    transform:
        rotate(70deg);

    opacity: 0.18;

    animation:
        orbitThree
        18s
        linear
        infinite;

}


@keyframes orbitOne {

    from {

        transform:
            rotate(25deg)
            rotateX(65deg);

    }

    to {

        transform:
            rotate(385deg)
            rotateX(65deg);

    }

}


@keyframes orbitTwo {

    from {

        transform:
            rotate(-35deg)
            rotateX(65deg);

    }

    to {

        transform:
            rotate(325deg)
            rotateX(65deg);

    }

}


@keyframes orbitThree {

    from {

        transform:
            rotate(70deg)
            rotateX(70deg);

    }

    to {

        transform:
            rotate(430deg)
            rotateX(70deg);

    }

}


/* =========================================================
   MAIN HOLLOW CORE
========================================================= */

.core {

    position: relative;

    width: 72%;

    height: 72%;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            #000 0%,
            #000 42%,
            rgba(0,0,0,0.98) 57%,
            rgba(255,210,30,0.03) 70%,
            transparent 78%
        );

    border:
        2px solid var(--core);

    box-shadow:

        inset
        0 0 25px var(--core),

        inset
        0 0 70px rgba(255,210,30,0.12),

        0 0 18px var(--core),

        0 0 50px var(--core),

        0 0 100px rgba(255,210,30,0.35);

    animation:
        coreBreath
        3s
        ease-in-out
        infinite;

    transition:
        border-color 0.45s ease,
        box-shadow 0.45s ease;

}


/* =========================================================
   INNER RINGS
========================================================= */

.core::before {

    content: "";

    position: absolute;

    inset: 7%;

    border-radius: 50%;

    border:
        1px solid var(--core);

    opacity: 0.55;

    box-shadow:
        0 0 12px var(--core);

    animation:
        innerRotate
        7s
        linear
        infinite;

}


.core::after {

    content: "";

    position: absolute;

    inset: 18%;

    border-radius: 50%;

    border:
        1px dashed var(--core);

    opacity: 0.6;

    animation:
        innerReverse
        5s
        linear
        infinite;

}


@keyframes coreBreath {

    0%,
    100% {

        transform: scale(0.96);

    }

    50% {

        transform: scale(1.035);

    }

}


@keyframes innerRotate {

    from {

        transform:
            rotate(0deg)
            scale(1);

    }

    to {

        transform:
            rotate(360deg)
            scale(1.04);

    }

}


@keyframes innerReverse {

    from {

        transform:
            rotate(360deg);

    }

    to {

        transform:
            rotate(0deg);

    }

}


/* =========================================================
   CORE ENERGY LINES
========================================================= */

.energy-line {

    position: absolute;

    width: 82%;

    height: 82%;

    border-radius: 50%;

    border:
        2px solid transparent;

    border-top-color: var(--core);

    border-bottom-color: var(--core);

    opacity: 0.45;

    filter:
        drop-shadow(
            0 0 8px var(--core)
        );

}


.energy-line:nth-child(1) {

    transform:
        rotate(20deg);

    animation:
        energyRotate
        4s
        linear
        infinite;

}


.energy-line:nth-child(2) {

    transform:
        rotate(120deg);

    opacity: 0.3;

    animation:
        energyRotateReverse
        6s
        linear
        infinite;

}


.energy-line:nth-child(3) {

    transform:
        rotate(240deg);

    opacity: 0.25;

    animation:
        energyRotate
        8s
        linear
        infinite;

}


@keyframes energyRotate {

    from {

        transform:
            rotate(0deg);

    }

    to {

        transform:
            rotate(360deg);

    }

}


@keyframes energyRotateReverse {

    from {

        transform:
            rotate(360deg);

    }

    to {

        transform:
            rotate(0deg);

    }

}


/* =========================================================
   CENTER POINT
========================================================= */

.center-point {

    position: absolute;

    width: 12px;
    height: 12px;

    border-radius: 50%;

    background: var(--core);

    box-shadow:

        0 0 10px var(--core),

        0 0 30px var(--core),

        0 0 70px var(--core),

        0 0 120px var(--core);

    animation:
        centerPulse
        1.5s
        ease-in-out
        infinite;

}


@keyframes centerPulse {

    0%,
    100% {

        transform:
            scale(0.7);

    }

    50% {

        transform:
            scale(1.4);

    }

}


/* =========================================================
   PARTICLES
========================================================= */

.particle {

    position: absolute;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: var(--core);

    box-shadow:
        0 0 10px var(--core);

    animation:
        particleOrbit
        var(--speed)
        linear
        infinite;

}


@keyframes particleOrbit {

    from {

        transform:
            rotate(0deg)
            translateX(var(--radius))
            rotate(0deg);

    }

    to {

        transform:
            rotate(360deg)
            translateX(var(--radius))
            rotate(-360deg);

    }

}


/* =========================================================
   STATUS
========================================================= */

.status {

    position: absolute;

    bottom: 150px;

    color: var(--core);

    font-size: 12px;

    letter-spacing: 5px;

    text-transform: uppercase;

    text-shadow:
        0 0 10px var(--core);

    transition:
        color 0.4s ease;

}


/* =========================================================
   COMMAND AREA
========================================================= */

.command-area {

    position: absolute;

    bottom: 55px;

    width:
        min(780px, 90vw);

    display: flex;

    align-items: center;

    gap: 12px;

}


/* =========================================================
   BUTTONS
========================================================= */

.control {

    width: 58px;
    height: 58px;

    flex-shrink: 0;

    border-radius: 50%;

    border:
        1px solid var(--core);

    background:
        rgba(0,0,0,0.75);

    color: var(--core);

    font-size: 20px;

    cursor: pointer;

    box-shadow:
        0 0 15px rgba(255,210,30,0.25);

    transition:
        0.25s ease;

}


.control:hover {

    transform:
        scale(1.1);

    background:
        var(--core);

    color:
        #000;

    box-shadow:
        0 0 25px var(--core);

}


.control.active {

    animation:
        micPulse
        1s
        infinite;

}


@keyframes micPulse {

    0%,
    100% {

        box-shadow:
            0 0 10px var(--core);

    }

    50% {

        box-shadow:
            0 0 40px var(--core);

    }

}


/* =========================================================
   INPUT
========================================================= */

.input-wrapper {

    flex: 1;

    height: 58px;

    display: flex;

    align-items: center;

    border:
        1px solid var(--core);

    border-radius: 35px;

    background:
        rgba(0,0,0,0.75);

    box-shadow:
        inset 0 0 15px rgba(255,210,30,0.05),
        0 0 15px rgba(255,210,30,0.15);

    overflow: hidden;

}


#command {

    width: 100%;

    height: 100%;

    border: none;

    outline: none;

    background: transparent;

    color: white;

    padding:
        0 25px;

    font-size: 15px;

}


#command::placeholder {

    color:
        rgba(255,255,255,0.38);

}


/* =========================================================
   SIDE CONTROLS
========================================================= */

.side-controls {

    position: absolute;

    top: 105px;

    right: 32px;

    display: flex;

    flex-direction: column;

    gap: 10px;

}


.side-button {

    width: 43px;
    height: 43px;

    border-radius: 12px;

    border:
        1px solid rgba(255,210,30,0.5);

    background:
        rgba(0,0,0,0.55);

    color:
        var(--core);

    cursor: pointer;

    font-size: 16px;

    transition:
        0.25s ease;

}


.side-button:hover {

    transform:
        translateX(-3px);

    border-color:
        var(--core);

    box-shadow:
        0 0 18px var(--core);

}


/* =========================================================
   CORNER INFO
========================================================= */

.corner-info {

    position: absolute;

    bottom: 20px;

    left: 28px;

    font-size: 9px;

    letter-spacing: 3px;

    color:
        rgba(255,255,255,0.28);

}


.corner-info.right {

    left: auto;

    right: 28px;

}


/* =========================================================
   BURST
========================================================= */

.burst {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 15px;
    height: 15px;

    margin-left: -7.5px;
    margin-top: -7.5px;

    border-radius: 50%;

    background:
        var(--core);

    box-shadow:

        0 0 20px var(--core),

        0 0 60px var(--core),

        0 0 120px var(--core),

        0 0 200px var(--core);

    opacity: 0;

    pointer-events: none;

    z-index: 30;

}


.burst.active {

    animation:
        burstExpand
        1.1s
        cubic-bezier(.1,.8,.2,1);

}


@keyframes burstExpand {

    0% {

        transform:
            scale(0.2);

        opacity: 1;

    }

    30% {

        opacity: 0.95;

    }

    100% {

        transform:
            scale(45);

        opacity: 0;

    }

}


/* =========================================================
   FLASH
========================================================= */

.flash {

    position: fixed;

    inset: 0;

    background:
        var(--core);

    opacity: 0;

    pointer-events: none;

    z-index: 20;

}


.flash.active {

    animation:
        screenFlash
        0.6s
        ease-out;

}


@keyframes screenFlash {

    0% {

        opacity: 0.25;

    }

    100% {

        opacity: 0;

    }

}


/* =========================================================
   UNLIMITED / RED MODE
========================================================= */

body.unlimited {

    --core: var(--red);

}


body.unlimited .logo {

    text-shadow:

        0 0 10px var(--red),

        0 0 30px var(--red),

        0 0 80px rgba(255,0,0,0.8);

}


body.unlimited .core {

    box-shadow:

        inset
        0 0 25px var(--red),

        inset
        0 0 80px rgba(255,0,0,0.2),

        0 0 20px var(--red),

        0 0 60px var(--red),

        0 0 120px rgba(255,0,0,0.5);

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 700px) {

    .logo {

        top: 25px;

        font-size: 38px;

        letter-spacing: 12px;

    }


    .connection {

        top: 30px;

        right: 18px;

        font-size: 8px;

    }


    .core-container {

        width: 90vw;

        height: 90vw;

    }


    .status {

        bottom: 125px;

        font-size: 9px;

        letter-spacing: 3px;

    }


    .command-area {

        bottom: 35px;

        width: 94vw;

        gap: 7px;

    }


    .control {

        width: 48px;

        height: 48px;

    }


    .input-wrapper {

        height: 48px;

    }


    .side-controls {

        top: 85px;

        right: 12px;

        flex-direction: row;

    }


    .side-button {

        width: 36px;

        height: 36px;

        font-size: 13px;

    }


    .corner-info {

        display: none;

    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            0.01ms !important;

        animation-iteration-count:
            1 !important;

    }

}

</style>

</head>


<body>

<div class="background"></div>

<div class="stars" id="stars"></div>

<div class="flash" id="flash"></div>


<div class="interface">


    <!-- =====================================================
         LOGO
    ====================================================== -->

    <div class="logo">
        EON
    </div>


    <!-- =====================================================
         CONNECTION
    ====================================================== -->

    <div class="connection">

        <div
            class="connection-dot"
            id="connectionDot"
        ></div>

        <span id="connectionText">
            CONNECTING
        </span>

    </div>


    <!-- =====================================================
         SIDE BUTTONS
    ====================================================== -->

    <div class="side-controls">

        <button
            class="side-button"
            onclick="checkConnection()"
            title="Connection"
        >
            ◉
        </button>

        <button
            class="side-button"
            onclick="showStatus()"
            title="System Status"
        >
            ◌
        </button>

        <button
            class="side-button"
            onclick="resetEON()"
            title="Reset"
        >
            ↻
        </button>

        <button
            class="side-button"
            onclick="toggleFullscreen()"
            title="Fullscreen"
        >
            ⛶
        </button>

    </div>


    <!-- =====================================================
         CORE
    ====================================================== -->

    <div class="core-container">

        <div class="aura"></div>

        <div class="orbit one"></div>

        <div class="orbit two"></div>

        <div class="orbit three"></div>


        <div class="core">

            <div class="energy-line"></div>

            <div class="energy-line"></div>

            <div class="energy-line"></div>

            <div class="center-point"></div>

        </div>


        <div
            class="burst"
            id="burst"
        ></div>

    </div>


    <!-- =====================================================
         STATUS
    ====================================================== -->

    <div
        class="status"
        id="status"
    >
        EON IS READY
    </div>


    <!-- =====================================================
         COMMAND
    ====================================================== -->

    <div class="command-area">


        <button
            class="control"
            id="micButton"
            onclick="toggleVoice()"
            title="Voice"
        >
            🎙
        </button>


        <div class="input-wrapper">

            <input
                id="command"
                type="text"
                autocomplete="off"
                placeholder="Speak to EON..."
            >

        </div>


        <button
            class="control"
            onclick="sendCommand()"
            title="Send"
        >
            ➤
        </button>


    </div>


    <!-- =====================================================
         CORNERS
    ====================================================== -->

    <div class="corner-info">
        EON · SYSTEM ONLINE
    </div>


    <div class="corner-info right">
        EXECUTIVE INTELLIGENCE
    </div>


</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const TOKEN_KEY = "eon_token";


let token =
    localStorage.getItem(TOKEN_KEY) || "";


let recognition = null;

let listening = false;


/* =========================================================
   ELEMENTS
========================================================= */

const commandInput =
    document.getElementById("command");


const statusElement =
    document.getElementById("status");


const burstElement =
    document.getElementById("burst");


const flashElement =
    document.getElementById("flash");


const micButton =
    document.getElementById("micButton");


const connectionDot =
    document.getElementById("connectionDot");


const connectionText =
    document.getElementById("connectionText");


/* =========================================================
   TOKEN
========================================================= */

function getToken() {

    if (token) {

        return token;

    }


    const entered =
        prompt(
            "Enter your EON API token:"
        );


    if (!entered) {

        return "";

    }


    token =
        entered.trim();


    localStorage.setItem(
        TOKEN_KEY,
        token
    );


    return token;

}


/* =========================================================
   STAR FIELD
========================================================= */

function createStars() {

    const container =
        document.getElementById("stars");


    for (
        let i = 0;
        i < 70;
        i++
    ) {

        const star =
            document.createElement("div");


        star.className =
            "star";


        star.style.left =
            Math.random() * 100 + "%";


        star.style.top =
            Math.random() * 100 + "%";


        star.style.setProperty(
            "--duration",
            (3 + Math.random() * 7) + "s"
        );


        container.appendChild(star);

    }

}


/* =========================================================
   PARTICLES
========================================================= */

function createParticles() {

    const coreContainer =
        document.querySelector(
            ".core-container"
        );


    for (
        let i = 0;
        i < 24;
        i++
    ) {

        const particle =
            document.createElement("div");


        particle.className =
            "particle";


        const radius =
            170 +
            Math.random() * 100;


        const speed =
            5 +
            Math.random() * 12;


        particle.style.setProperty(
            "--radius",
            radius + "px"
        );


        particle.style.setProperty(
            "--speed",
            speed + "s"
        );


        particle.style.left =
            "50%";


        particle.style.top =
            "50%";


        particle.style.animationDelay =
            -(Math.random() * speed) + "s";


        coreContainer.appendChild(
            particle
        );

    }

}


/* =========================================================
   BURST
========================================================= */

function triggerBurst() {

    burstElement.classList.remove(
        "active"
    );


    flashElement.classList.remove(
        "active"
    );


    void burstElement.offsetWidth;


    burstElement.classList.add(
        "active"
    );


    flashElement.classList.add(
        "active"
    );

}


/* =========================================================
   MODE
========================================================= */

function setUnlimited(enabled) {

    triggerBurst();


    document.body.classList.toggle(
        "unlimited",
        enabled
    );


    if (enabled) {

        statusElement.textContent =
            "LIMITS RELEASED";

    } else {

        statusElement.textContent =
            "EON IS READY";

    }

}


/* =========================================================
   COMMAND MODE DETECTION
========================================================= */

function detectMode(command) {

    const lower =
        command
            .toLowerCase()
            .trim();


    if (
        lower.includes(
            "eon has no limits"
        )
    ) {

        setUnlimited(true);

    }


    if (
        lower.includes(
            "eon has limits"
        )
    ) {

        setUnlimited(false);

    }

}


/* =========================================================
   SPEECH OUTPUT
========================================================= */

function speak(text) {

    if (!text) {

        return;

    }


    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            String(text)
        );


    speech.rate = 0.95;

    speech.pitch = 0.82;

    speech.volume = 1;


    speech.onstart = function() {

        statusElement.textContent =
            "EON SPEAKING...";

    };


    speech.onend = function() {

        if (
            !document.body.classList.contains(
                "unlimited"
            )
        ) {

            statusElement.textContent =
                "EON IS READY";

        }

    };


    window.speechSynthesis.speak(
        speech
    );

}


/* =========================================================
   SEND COMMAND
========================================================= */

async function sendCommand() {

    const command =
        commandInput.value.trim();


    if (!command) {

        return;

    }


    const currentToken =
        getToken();


    if (!currentToken) {

        statusElement.textContent =
            "API TOKEN REQUIRED";

        return;

    }


    statusElement.textContent =
        "PROCESSING...";


    detectMode(command);


    try {

        const response =
            await fetch(
                "/api/command",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "X-EON-TOKEN":
                            currentToken

                    },

                    body:
                        JSON.stringify({
                            command:
                                command
                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            if (
                response.status === 401
            ) {

                localStorage.removeItem(
                    TOKEN_KEY
                );

                token = "";

                statusElement.textContent =
                    "INVALID API TOKEN";

                return;

            }


            throw new Error(
                data.detail ||
                "Connection failed."
            );

        }


        if (!data.success) {

            throw new Error(
                data.error ||
                "EON returned an error."
            );

        }


        let answer =
            data.response;


        if (
            typeof answer !==
            "string"
        ) {

            answer =
                JSON.stringify(
                    answer
                );

        }


        statusElement.textContent =
            answer ||
            "COMMAND COMPLETE";


        speak(answer);


        commandInput.value =
            "";

    }

    catch (error) {

        console.error(error);


        statusElement.textContent =
            "CONNECTION ERROR";

    }

}


/* =========================================================
   VOICE RECOGNITION
========================================================= */

function setupRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        return false;

    }


    recognition =
        new SpeechRecognition();


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.lang =
        "en-IN";


    recognition.onstart =
        function() {

            listening = true;

            micButton.classList.add(
                "active"
            );

            statusElement.textContent =
                "LISTENING...";

        };


    recognition.onresult =
        function(event) {

            const text =
                event
                    .results[0][0]
                    .transcript;


            commandInput.value =
                text;


            detectMode(text);


            sendCommand();

        };


    recognition.onerror =
        function(event) {

            console.error(
                "Speech error:",
                event.error
            );


            statusElement.textContent =
                "VOICE ERROR";

        };


    recognition.onend =
        function() {

            listening = false;

            micButton.classList.remove(
                "active"
            );


            if (
                !document.body.classList.contains(
                    "unlimited"
                )
            ) {

                statusElement.textContent =
                    "EON IS READY";

            }

        };


    return true;

}


/* =========================================================
   VOICE TOGGLE
========================================================= */

function toggleVoice() {

    if (!recognition) {

        const available =
            setupRecognition();


        if (!available) {

            statusElement.textContent =
                "VOICE NOT SUPPORTED";

            return;

        }

    }


    if (listening) {

        recognition.stop();

        return;

    }


    try {

        recognition.start();

    }

    catch (error) {

        console.error(error);

    }

}


/* =========================================================
   CONNECTION CHECK
========================================================= */

async function checkConnection() {

    connectionText.textContent =
        "CONNECTING";


    statusElement.textContent =
        "CHECKING CONNECTION...";


    try {

        const response =
            await fetch(
                "/health"
            );


        const data =
            await response.json();


        if (
            response.ok &&
            data.success
        ) {

            connectionText.textContent =
                "ONLINE";


            connectionDot.style.background =
                "var(--core)";


            connectionDot.style.boxShadow =
                "0 0 10px var(--core)";


            statusElement.textContent =
                "SYSTEM ONLINE";

        }

        else {

            throw new Error(
                "Health check failed."
            );

        }

    }

    catch (error) {

        console.error(error);


        connectionText.textContent =
            "OFFLINE";


        connectionDot.style.background =
            "#ff2525";


        connectionDot.style.boxShadow =
            "0 0 10px #ff2525";


        statusElement.textContent =
            "CONNECTION ERROR";

    }

}


/* =========================================================
   STATUS
========================================================= */

async function showStatus() {

    const currentToken =
        getToken();


    if (!currentToken) {

        statusElement.textContent =
            "API TOKEN REQUIRED";

        return;

    }


    statusElement.textContent =
        "READING SYSTEM STATUS...";


    try {

        const response =
            await fetch(
                "/api/status",
                {

                    headers: {

                        "X-EON-TOKEN":
                            currentToken

                    }

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Unable to read status."
            );

        }


        statusElement.textContent =
            "SYSTEM ONLINE";

        console.log(
            "EON STATUS:",
            data.status
        );

    }

    catch (error) {

        console.error(error);

        statusElement.textContent =
            "STATUS ERROR";

    }

}


/* =========================================================
   RESET
========================================================= */

async function resetEON() {

    const currentToken =
        getToken();


    if (!currentToken) {

        return;

    }


    triggerBurst();


    try {

        const response =
            await fetch(
                "/api/reset",
                {

                    method: "POST",

                    headers: {

                        "X-EON-TOKEN":
                            currentToken

                    }

                }
            );


        if (!response.ok) {

            throw new Error(
                "Reset failed."
            );

        }


        setUnlimited(false);


        statusElement.textContent =
            "EON RESET";

        window.speechSynthesis.cancel();

    }

    catch (error) {

        console.error(error);

        statusElement.textContent =
            "RESET ERROR";

    }

}


/* =========================================================
   FULLSCREEN
========================================================= */

function toggleFullscreen() {

    if (!document.fullscreenElement) {

        document.documentElement
            .requestFullscreen()
            .catch(
                error =>
                    console.error(error)
            );

    }

    else {

        document.exitFullscreen();

    }

}


/* =========================================================
   KEYBOARD
========================================================= */

commandInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendCommand();

        }

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

createStars();

createParticles();

setupRecognition();

checkConnection();

</script>
