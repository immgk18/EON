<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>EON</title>

<style>
:root {
    --gold: #ffd21c;
    --gold-soft: #ffea75;
    --red: #ff3030;
    --bg: #020202;
    --text: #eeeeee;
    --muted: #777;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family:
        "Segoe UI",
        Arial,
        sans-serif;
}

body {
    position: relative;
}

/* =========================
   BACKGROUND
========================= */

.background {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(255, 210, 28, 0.08),
            transparent 35%
        ),
        radial-gradient(
            circle at 50% 50%,
            rgba(255, 255, 255, 0.025),
            transparent 60%
        ),
        #020202;
    transition: background 1s ease;
}

body.alert .background {
    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(255, 20, 20, 0.13),
            transparent 35%
        ),
        #020202;
}

/* =========================
   PARTICLES
========================= */

#particles {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

/* =========================
   HEADER
========================= */

.header {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    text-align: center;
}

.logo {
    font-family: Georgia, serif;
    font-size: clamp(46px, 7vw, 86px);
    font-weight: 500;
    letter-spacing: 0.35em;
    color: var(--gold-soft);
    text-shadow:
        0 0 8px var(--gold),
        0 0 25px rgba(255, 210, 28, .6),
        0 0 60px rgba(255, 210, 28, .25);
    transition: color .7s ease,
                text-shadow .7s ease;
}

body.alert .logo {
    color: #ff5555;
    text-shadow:
        0 0 10px #ff3030,
        0 0 35px rgba(255, 40, 40, .7),
        0 0 70px rgba(255, 20, 20, .35);
}

/* =========================
   TOP CONTROLS
========================= */

.top-controls {
    position: absolute;
    top: 28px;
    right: 28px;
    z-index: 30;

    display: flex;
    gap: 10px;
}

.control {
    width: 44px;
    height: 44px;

    border: 1px solid rgba(255, 210, 28, .35);
    border-radius: 12px;

    background: rgba(0,0,0,.5);
    color: var(--gold);

    cursor: pointer;

    font-size: 17px;

    backdrop-filter: blur(10px);

    transition:
        transform .2s ease,
        box-shadow .3s ease,
        background .3s ease;
}

.control:hover {
    transform: translateY(-2px) scale(1.05);
    background: rgba(255, 210, 28, .08);
    box-shadow:
        0 0 15px rgba(255,210,28,.25);
}

/* =========================
   STATUS PANEL
========================= */

.status-panel {
    position: absolute;
    top: 28px;
    left: 28px;
    z-index: 30;

    width: 220px;

    padding: 18px;

    border: 1px solid rgba(255,210,28,.25);
    border-radius: 15px;

    background: rgba(0,0,0,.55);
    backdrop-filter: blur(12px);

    box-shadow:
        inset 0 0 20px rgba(255,210,28,.025);
}

.status-title {
    display: flex;
    align-items: center;
    gap: 9px;

    font-size: 13px;
    letter-spacing: .14em;
}

.status-dot {
    width: 9px;
    height: 9px;

    border-radius: 50%;
    background: var(--gold);

    box-shadow:
        0 0 8px var(--gold),
        0 0 18px var(--gold);
}

.status-line {
    height: 1px;
    margin: 15px 0;

    background:
        linear-gradient(
            90deg,
            rgba(255,210,28,.35),
            transparent
        );
}

.status-row {
    display: flex;
    justify-content: space-between;

    margin: 8px 0;

    font-size: 11px;
    letter-spacing: .12em;
}

.status-row span:last-child {
    color: var(--gold);
}

/* =========================
   CORE
========================= */

.core-area {
    position: absolute;

    left: 50%;
    top: 48%;

    transform: translate(-50%, -50%);

    width: min(600px, 72vw);
    height: min(600px, 72vw);

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 5;
}

/* outer aura */

.aura {
    position: absolute;

    width: 72%;
    height: 72%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,210,28,.17),
            rgba(255,210,28,.04) 45%,
            transparent 70%
        );

    filter: blur(20px);

    animation:
        auraPulse 3s ease-in-out infinite;
}

/* main energy shell */

.core {
    position: relative;

    width: 62%;
    height: 62%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #090909 0 34%,
            transparent 35%
        );

    box-shadow:
        0 0 18px var(--gold),
        0 0 45px rgba(255,210,28,.75),
        0 0 90px rgba(255,210,28,.35),
        inset 0 0 35px rgba(255,210,28,.3);

    animation:
        corePulse 2.6s ease-in-out infinite;

    transition:
        box-shadow 1s ease,
        transform .6s ease;
}

/* hollow center */

.core::before {
    content: "";

    position: absolute;
    inset: 16%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #000 0 60%,
            rgba(5,5,5,.96) 75%,
            transparent 100%
        );

    border:
        1px solid rgba(255,255,255,.12);

    box-shadow:
        inset 0 0 25px rgba(0,0,0,.9);
}

/* bright energy edge */

.core::after {
    content: "";

    position: absolute;
    inset: -2%;

    border-radius: 50%;

    border:
        2px solid rgba(255,220,70,.9);

    box-shadow:
        0 0 12px var(--gold),
        0 0 30px var(--gold),
        inset 0 0 20px var(--gold);

    animation:
        edgePulse 2s ease-in-out infinite;
}

/* =========================
   ORBITS
========================= */

.orbit {
    position: absolute;

    border-radius: 50%;

    border:
        1px solid rgba(255,210,28,.35);

    box-shadow:
        0 0 8px rgba(255,210,28,.15);

    pointer-events: none;
}

.orbit.one {
    width: 75%;
    height: 35%;

    transform: rotate(18deg);

    animation:
        orbitSpin 8s linear infinite;
}

.orbit.two {
    width: 85%;
    height: 42%;

    transform: rotate(-25deg);

    animation:
        orbitSpinReverse 12s linear infinite;
}

.orbit.three {
    width: 70%;
    height: 88%;

    transform: rotate(62deg);

    animation:
        orbitSpin 16s linear infinite;
}

.orbit.four {
    width: 94%;
    height: 55%;

    transform: rotate(82deg);

    opacity: .45;

    animation:
        orbitSpinReverse 20s linear infinite;
}

/* orbit particles */

.orbit::after {
    content: "";

    position: absolute;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: var(--gold);

    box-shadow:
        0 0 8px var(--gold),
        0 0 20px var(--gold);

    top: 0;
    left: 50%;
}

/* =========================
   CORE TEXT
========================= */

.core-text {
    position: absolute;

    z-index: 10;

    text-align: center;

    color: rgba(255,255,255,.7);

    font-size: 11px;
    letter-spacing: .35em;

    pointer-events: none;
}

.core-state {
    margin-top: 13px;

    font-size: 9px;

    color: var(--gold);

    letter-spacing: .45em;
}

/* =========================
   SIDE INDICATORS
========================= */

.side {
    position: absolute;

    top: 48%;

    transform: translateY(-50%);

    z-index: 20;

    text-align: center;

    color: rgba(255,255,255,.65);

    letter-spacing: .3em;

    font-size: 10px;
}

.side.left {
    left: 7%;
}

.side.right {
    right: 7%;
}

.wave {
    margin-top: 13px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 3px;

    height: 30px;
}

.wave i {
    width: 3px;

    border-radius: 5px;

    background: var(--gold);

    box-shadow:
        0 0 8px var(--gold);

    animation:
        wave 1s ease-in-out infinite;
}

.wave i:nth-child(1) { height: 8px; animation-delay: -.4s; }
.wave i:nth-child(2) { height: 15px; animation-delay: -.3s; }
.wave i:nth-child(3) { height: 24px; animation-delay: -.2s; }
.wave i:nth-child(4) { height: 13px; animation-delay: -.1s; }
.wave i:nth-child(5) { height: 28px; }
.wave i:nth-child(6) { height: 16px; animation-delay: -.1s; }
.wave i:nth-child(7) { height: 8px; animation-delay: -.2s; }

/* =========================
   COMMAND BAR
========================= */

.command-area {
    position: absolute;

    bottom: 55px;

    left: 50%;
    transform: translateX(-50%);

    width: min(790px, 72vw);

    z-index: 30;
}

.command {
    display: flex;
    align-items: center;

    height: 68px;

    padding: 7px;

    border:
        1px solid rgba(255,210,28,.6);

    border-radius: 40px;

    background:
        rgba(0,0,0,.7);

    box-shadow:
        0 0 20px rgba(255,210,28,.1),
        inset 0 0 20px rgba(255,210,28,.03);

    backdrop-filter: blur(12px);
}

.command input {
    flex: 1;

    height: 100%;

    border: none;
    outline: none;

    background: transparent;

    padding: 0 20px;

    color: white;

    font-size: 15px;
}

.command input::placeholder {
    color: #555;
}

.icon-button {
    width: 52px;
    height: 52px;

    border-radius: 50%;

    border:
        1px solid rgba(255,210,28,.6);

    background: rgba(255,210,28,.04);

    color: var(--gold);

    cursor: pointer;

    font-size: 20px;

    transition: .25s ease;
}

.icon-button:hover {
    background: rgba(255,210,28,.15);

    box-shadow:
        0 0 20px rgba(255,210,28,.4);

    transform: scale(1.06);
}

/* =========================
   FOOTER
========================= */

.footer {
    position: absolute;

    bottom: 18px;

    left: 50%;
    transform: translateX(-50%);

    z-index: 20;

    font-size: 9px;

    letter-spacing: .45em;

    color: #555;

    text-align: center;
}

/* =========================
   BURST
========================= */

.burst {
    position: fixed;

    left: 50%;
    top: 48%;

    width: 20px;
    height: 20px;

    border-radius: 50%;

    transform:
        translate(-50%, -50%)
        scale(0);

    border: 2px solid var(--gold);

    box-shadow:
        0 0 20px var(--gold),
        0 0 50px var(--gold),
        0 0 100px var(--gold);

    pointer-events: none;

    z-index: 50;

    opacity: 0;
}

.burst.active {
    animation: burst .9s ease-out;
}

/* =========================
   ALERT MODE
========================= */

body.alert .core {
    box-shadow:
        0 0 20px var(--red),
        0 0 50px rgba(255,30,30,.8),
        0 0 110px rgba(255,20,20,.45),
        inset 0 0 40px rgba(255,30,30,.4);
}

body.alert .core::after {
    border-color: #ff3030;

    box-shadow:
        0 0 15px #ff3030,
        0 0 35px #ff3030,
        inset 0 0 20px #ff3030;
}

body.alert .orbit {
    border-color: rgba(255,50,50,.45);
}

body.alert .orbit::after,
body.alert .wave i,
body.alert .status-dot {
    background: var(--red);

    box-shadow:
        0 0 10px var(--red),
        0 0 25px var(--red);
}

body.alert .core-state {
    color: #ff4444;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes corePulse {
    0%,100% {
        transform: scale(.97);
    }

    50% {
        transform: scale(1.025);
    }
}

@keyframes auraPulse {
    0%,100% {
        transform: scale(.9);
        opacity: .55;
    }

    50% {
        transform: scale(1.15);
        opacity: 1;
    }
}

@keyframes edgePulse {
    0%,100% {
        opacity: .65;
    }

    50% {
        opacity: 1;
    }
}

@keyframes orbitSpin {
    from {
        transform:
            rotate(0deg)
            rotate(18deg);
    }

    to {
        transform:
            rotate(360deg)
            rotate(18deg);
    }
}

@keyframes orbitSpinReverse {
    from {
        transform:
            rotate(0deg)
            rotate(-25deg);
    }

    to {
        transform:
            rotate(-360deg)
            rotate(-25deg);
    }
}

@keyframes wave {
    0%,100% {
        transform: scaleY(.45);
    }

    50% {
        transform: scaleY(1.25);
    }
}

@keyframes burst {
    0% {
        transform:
            translate(-50%, -50%)
            scale(.1);

        opacity: 1;
    }

    100% {
        transform:
            translate(-50%, -50%)
            scale(30);

        opacity: 0;
    }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .status-panel {
        display: none;
    }

    .top-controls {
        top: 18px;
        right: 18px;
    }

    .control {
        width: 38px;
        height: 38px;
    }

    .header {
        top: 18px;
    }

    .logo {
        font-size: 48px;
    }

    .core-area {
        width: 100vw;
        height: 100vw;
        top: 45%;
    }

    .side {
        display: none;
    }

    .command-area {
        width: 92vw;
        bottom: 45px;
    }

    .command {
        height: 62px;
    }

    .footer {
        display: none;
    }
}
</style>
</head>

<body>

<div class="background"></div>

<canvas id="particles"></canvas>

<!-- BURST EFFECT -->
<div class="burst" id="burst"></div>

<!-- HEADER -->
<div class="header">
    <div class="logo">EON</div>
</div>

<!-- CONTROLS -->
<div class="top-controls">

    <button class="control"
            id="voiceButton"
            title="Voice">
        🎙
    </button>

    <button class="control"
            id="statusButton"
            title="Status">

    </button>

<!-- STATUS -->
<div class="status-panel">

    </div>

    <div class="status-line"></div>

    <div class="status-row">
        <span>AI CORE</span>
        <span id="aiStatus">ONLINE</span>
    </div>

    <div class="status-row">
        <span>VOICE</span>
        <span id="voiceStatus">READY</span>
    </div>

    <div class="status-row">
        <span>VISION</span>

    </div>

    <div class="status-row">
        <span>MEMORY</span>
        <span>ONLINE</span>
    </div>

    <div class="status-row">
        <span>SECURITY</span>
        <span>ACTIVE</span>
    </div>

</div>

<!-- LEFT -->
<div class="side left">

    <div id="leftText">
        STANDBY
    </div>

    <div class="wave">
        <i></i>
        <i></i>
        <i></i>
        <i></i>
        <i></i>
        <i></i>
        <i></i>
    </div>

</div>

<!-- RIGHT -->
<div class="side right">

    <div id="rightText">
        READY
    </div>

    <div class="wave">
        <i></i>
        <i></i>
        <i></i>
        <i></i>
        <i></i>
        <i></i>
        <i></i>
    </div>

</div>

<!-- CORE -->
<div class="core-area">

    <div class="aura"></div>

    <div class="orbit one"></div>
    <div class="orbit two"></div>
    <div class="orbit three"></div>
    <div class="orbit four"></div>

    <div class="core">

        <div class="core-text">

            <div id="coreStatus">
                EON ONLINE
            </div>

            <div class="core-state"
                 id="modeText">
                NORMAL
            </div>

        </div>

    </div>

</div>

<!-- COMMAND -->
<div class="command-area">

    <div class="command">

        <button class="icon-button"
                id="micButton"
                title="Speak">
            🎙
        </button>

        <input
            id="commandInput"
            type="text"
            autocomplete="off"
            placeholder="Speak to EON..."
        >

        <button class="icon-button"
                id="sendButton"
                title="Send">
            ➤
        </button>

    </div>

</div>

<div class="footer" id="footerText">
    EON IS READY
</div>

<script>

/* =========================================================
   EON CONFIG
========================================================= */

const API_BASE = "/api";

let apiToken =
    localStorage.getItem("EON_API_TOKEN") || "";

let listening = false;
let alertMode = false;


/* =========================================================
   DOM
========================================================= */

const input =
    document.getElementById("commandInput");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const voiceButton =
    document.getElementById("voiceButton");

const clearButton =
    document.getElementById("clearButton");

const statusButton =
    document.getElementById("statusButton");

const fullscreenButton =
    document.getElementById("fullscreenButton");

const coreStatus =
    document.getElementById("coreStatus");

const modeText =
    document.getElementById("modeText");

const footerText =
    document.getElementById("footerText");

const leftText =
    document.getElementById("leftText");

const rightText =
    document.getElementById("rightText");

const voiceStatus =
    document.getElementById("voiceStatus");

const aiStatus =
    document.getElementById("aiStatus");

const burst =
    document.getElementById("burst");


/* =========================================================
   TOKEN
========================================================= */

function getToken() {

    if (apiToken) {
        return apiToken;
    }

    apiToken = prompt(
        "Enter your EON API token:"
    );

    if (!apiToken) {
        return null;
    }

    apiToken = apiToken.trim();

    localStorage.setItem(
        "EON_API_TOKEN",
        apiToken
    );

    return apiToken;
}


/* =========================================================
   API REQUEST
========================================================= */

async function apiRequest(
    endpoint,
    options = {}
) {

    const token = getToken();

    if (!token) {
        throw new Error(
            "API token required."
        );
    }

    const headers = {
        "Content-Type":
            "application/json",

        "X-EON-Token":
            token,

        "Authorization":
            "Bearer " + token
    };

    const response =
        await fetch(
            API_BASE + endpoint,
            {
                ...options,
                headers: {
                    ...headers,
                    ...(options.headers || {})
                }
            }
        );

    let data;

    try {
        data =
            await response.json();

    } catch {
        throw new Error(
            "EON API returned an invalid response."
        );
    }

    if (!response.ok) {

        if (
            response.status === 401 ||
            response.status === 403
        ) {

            localStorage.removeItem(
                "EON_API_TOKEN"
            );

            apiToken = "";

            throw new Error(
                "Invalid EON API token."
            );
        }

        throw new Error(
            data.error ||
            "EON API request failed."
        );
    }

    return data;
}


/* =========================================================
   CONNECTION TEST
========================================================= */

async function connectEON() {

    try {

        footerText.textContent =
            "CONNECTING TO EON...";

        const data =
            await apiRequest(
                "/status"
            );

        aiStatus.textContent =
            "ONLINE";

        footerText.textContent =
            "EON IS READY";

        coreStatus.textContent =
            "EON ONLINE";

        return true;

    } catch (error) {

        console.error(error);

        footerText.textContent =
            "CONNECTION FAILED";

        aiStatus.textContent =
            "OFFLINE";

        alert(
            "EON connection failed.\n\n" +
            error.message +
            "\n\nCheck the EON API token in Render."
        );

        return false;
    }
}


/* =========================================================
   SEND COMMAND
========================================================= */

async function sendCommand() {

    const command =
        input.value.trim();

    if (!command) {
        return;
    }

    input.value = "";

    setThinking();

    try {

        const result =
            await apiRequest(
                "/command",
                {
                    method: "POST",

                    body:
                        JSON.stringify({
                            command: command
                        })
                }
            );

        const reply =
            result.response ||
            result.result ||
            result.message ||
            "Command completed.";

        processModeCommand(command);

        speakResponse(reply);

        footerText.textContent =
            reply;

        setReady();

    } catch (error) {

        console.error(error);

        footerText.textContent =
            "EON ERROR";

        coreStatus.textContent =
            "CONNECTION ERROR";

        setReady();

        alert(
            error.message
        );
    }
}


/* =========================================================
   MODE CONTROL
========================================================= */

function processModeCommand(command) {

    const text =
        command.toLowerCase().trim();

    /*
       Normal mode
    */

    if (
        text.includes(
            "eon has limits"
        ) ||
        text.includes(
            "eon has limit"
        )
    ) {

        setNormalMode();
        return;
    }

    /*
       High-alert mode
    */

    if (
        text.includes(
            "eon has no limits"
        ) ||
        text.includes(
            "eon no limits"
        )
    ) {

        setAlertMode();
    }
}


/* =========================================================
   NORMAL MODE
========================================================= */

function setNormalMode() {

    if (!alertMode) {
        return;
    }

    alertMode = false;

    document.body.classList.remove(
        "alert"
    );

    modeText.textContent =
        "NORMAL";

    coreStatus.textContent =
        "EON ONLINE";

    footerText.textContent =
        "EON HAS LIMITS";

    triggerBurst();
}


/* =========================================================
   ALERT MODE
========================================================= */

function setAlertMode() {

    if (alertMode) {
        return;
    }

    alertMode = true;

    document.body.classList.add(
        "alert"
    );

    modeText.textContent =
        "HIGH ALERT";

    coreStatus.textContent =
        "LIMITERS RELEASED";

    footerText.textContent =
        "EON HAS NO LIMITS";

    triggerBurst();
}


/* =========================================================
   BURST
========================================================= */

function triggerBurst() {

    burst.classList.remove(
        "active"
    );

    void burst.offsetWidth;

    burst.classList.add(
        "active"
    );
}


/* =========================================================
   THINKING
========================================================= */

function setThinking() {

    coreStatus.textContent =
        "THINKING";

    footerText.textContent =
        "PROCESSING...";

    leftText.textContent =
        "LISTENING";

    rightText.textContent =
        "PROCESSING";
}


/* =========================================================
   READY
========================================================= */

function setReady() {

    coreStatus.textContent =
        alertMode
            ? "HIGH ALERT"
            : "EON ONLINE";

    leftText.textContent =
        "STANDBY";

    rightText.textContent =
        "READY";
}


/* =========================================================
   SPEECH SYNTHESIS
========================================================= */

function speakResponse(text) {

    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }

    speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(
            text
        );

    speech.rate = 0.92;
    speech.pitch = 0.9;
    speech.volume = 1;

    speech.onstart = () => {

        coreStatus.textContent =
            "SPEAKING";

        footerText.textContent =
            "EON SPEAKING";

    };

    speech.onend = () => {
        setReady();
    };

    speech.onerror = () => {
        setReady();
    };

    speechSynthesis.speak(
        speech
    );
}


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.continuous = false;

    recognition.interimResults =
        false;

    recognition.lang =
        "en-IN";

    recognition.onstart = () => {

        listening = true;

        voiceStatus.textContent =
            "LISTENING";

        leftText.textContent =
            "LISTENING...";

        coreStatus.textContent =
            "LISTENING";

        micButton.textContent =
            "■";
    };

    recognition.onresult =
        event => {

            const text =
                event.results[0][0].transcript;

            input.value = text;

            processModeCommand(text);

            sendCommand();
        };

    recognition.onerror =
        event => {

            console.error(
                "Speech error:",
                event.error
            );

            listening = false;

            voiceStatus.textContent =
                "READY";

            micButton.textContent =
                "🎙";

            setReady();
        };

    recognition.onend = () => {

        listening = false;

        voiceStatus.textContent =
            "READY";

        micButton.textContent =
            "🎙";
    };

} else {

    voiceStatus.textContent =
        "UNAVAILABLE";
}


/* =========================================================
   START LISTENING
========================================================= */

function startListening() {

    if (!recognition) {

        alert(
            "Voice recognition is not supported by this browser."
        );

        return;
    }

    if (listening) {

        recognition.stop();

        return;
    }

    try {

        recognition.start();

    } catch (error) {

        console.error(error);
    }
}


/* =========================================================
   BUTTONS
========================================================= */

sendButton.addEventListener(
    "click",
    sendCommand
);

micButton.addEventListener(
    "click",
    startListening
);

voiceButton.addEventListener(
    "click",
    startListening
);

input.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            sendCommand();
        }
    }
);


/* STATUS BUTTON */

statusButton.addEventListener(
    "click",
    async () => {

        try {

            const data =
                await apiRequest(
                    "/status"
                );

            footerText.textContent =
                "EON STATUS: ONLINE";

            console.log(
                "EON STATUS:",
                data
            );

        } catch (error) {

            footerText.textContent =
                "STATUS CHECK FAILED";

            alert(
                error.message
            );
        }
    }
);


/* CLEAR BUTTON */

clearButton.addEventListener(
    "click",
    () => {

        input.value = "";

        footerText.textContent =
            "EON READY";

        setReady();
    }
);


/* FULLSCREEN BUTTON */

fullscreenButton.addEventListener(
    "click",
    async () => {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document.documentElement
                    .requestFullscreen();

            } else {

                await document.exitFullscreen();
            }

        } catch (error) {

            console.error(error);
        }
    }
);


/* =========================================================
   PARTICLE SYSTEM
========================================================= */

const canvas =
    document.getElementById(
        "particles"
    );

const ctx =
    canvas.getContext("2d");

let particles = [];

function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


function createParticles() {

    particles = [];

    const count =
        Math.min(
            160,
            Math.floor(
                window.innerWidth / 8
            )
        );

    for (
        let i = 0;
        i < count;
        i++
    ) {

        particles.push({

            x:
                Math.random() *
                canvas.width,

            y:
                Math.random() *
                canvas.height,

            size:
                Math.random() *
                2 + .3,

            speed:
                Math.random() *
                .45 + .1,

            alpha:
                Math.random() *
                .7 + .1,

            phase:
                Math.random() *
                Math.PI * 2
        });
    }
}

createParticles();


function animateParticles(
    time
) {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const alert =
        document.body.classList
            .contains("alert");

    const color =
        alert
            ? "255,45,45"
            : "255,210,28";

    for (
        const p of particles
    ) {

        p.y -= p.speed;

        if (p.y < -10) {
            p.y =
                canvas.height + 10;
        }

        const pulse =
            .5 +
            .5 *
            Math.sin(
                time * .002 +
                p.phase
            );

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size * (0.7 + pulse),
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(${color},${p.alpha * pulse})`;

        ctx.fill();
    }

    requestAnimationFrame(
        animateParticles
    );
}

requestAnimationFrame(
    animateParticles
);

   INITIAL CONNECTION
========================================================= */

setTimeout(
    () => {

        if (apiToken) {
            connectEON();
        } else {

            footerText.textContent =
                "ENTER API TOKEN TO CONNECT";
        }

    },
    500
);
