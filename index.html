<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EON</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family:
                "Segoe UI",
                Arial,
                sans-serif;
            background: #000;
            color: #fff;
        }


        /* =====================================================
           MAIN SCREEN
        ===================================================== */

        body {
            position: relative;
            background:
                radial-gradient(
                    circle at center,
                    rgba(255, 190, 0, 0.045),
                    transparent 38%
                ),
                #000;
        }


        /* =====================================================
           STAR / PARTICLE FIELD
        ===================================================== */

        .space {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255, 255, 255, 0.65);
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }

        .star:nth-child(1) {
            top: 12%;
            left: 18%;
        }

        .star:nth-child(2) {
            top: 22%;
            left: 76%;
            animation-delay: .8s;
        }

        .star:nth-child(3) {
            top: 70%;
            left: 13%;
            animation-delay: 1.4s;
        }

        .star:nth-child(4) {
            top: 78%;
            left: 82%;
            animation-delay: 2s;
        }

        .star:nth-child(5) {
            top: 35%;
            left: 90%;
            animation-delay: .4s;
        }

        .star:nth-child(6) {
            top: 15%;
            left: 48%;
            animation-delay: 1.1s;
        }

        .star:nth-child(7) {
            top: 88%;
            left: 45%;
            animation-delay: 1.8s;
        }

        .star:nth-child(8) {
            top: 52%;
            left: 5%;
            animation-delay: 2.4s;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: .15;
                transform: scale(.7);
            }

            50% {
                opacity: .9;
                transform: scale(1.5);
            }
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {
            position: fixed;
            top: 28px;
            left: 40px;
            right: 40px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            z-index: 20;
        }

        .logo {
            font-size: 22px;
            font-weight: 500;
            letter-spacing: 9px;
            color: rgba(255, 255, 255, .9);
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 9px;

            font-size: 10px;
            letter-spacing: 3px;

            color: rgba(255, 255, 255, .55);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;

            background: #ffd000;

            box-shadow:
                0 0 8px #ffd000,
                0 0 18px rgba(255, 208, 0, .5);
        }


        /* =====================================================
           CENTER STAGE
        ===================================================== */

        .stage {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 5;
        }


        /* =====================================================
           ORB CONTAINER
        ===================================================== */

        .orb-container {
            position: relative;

            width: min(58vw, 470px);
            height: min(58vw, 470px);

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* =====================================================
           OUTER AURA
        ===================================================== */

        .aura {
            position: absolute;

            width: 100%;
            height: 100%;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 205, 0, .22),
                    rgba(255, 180, 0, .08) 35%,
                    transparent 70%
                );

            filter: blur(18px);

            animation:
                breathe 4s ease-in-out infinite;
        }

        @keyframes breathe {

            0%,
            100% {
                transform: scale(.88);
                opacity: .65;
            }

            50% {
                transform: scale(1.08);
                opacity: 1;
            }
        }


        /* =====================================================
           ORBIT RINGS
        ===================================================== */

        .orbit {
            position: absolute;

            width: 94%;
            height: 36%;

            border: 1px solid
                rgba(255, 208, 0, .22);

            border-radius: 50%;

            transform: rotate(-22deg);

            animation:
                orbitSpin 9s linear infinite;
        }

        .orbit.two {
            width: 85%;
            height: 48%;

            transform: rotate(62deg);

            animation-duration: 13s;
            animation-direction: reverse;
        }

        .orbit.three {
            width: 75%;
            height: 58%;

            transform: rotate(130deg);

            animation-duration: 17s;
        }

        @keyframes orbitSpin {

            from {
                transform:
                    rotate(0deg)
                    rotateX(68deg);
            }

            to {
                transform:
                    rotate(360deg)
                    rotateX(68deg);
            }
        }


        /* =====================================================
           ORB
        ===================================================== */

        .orb {

            position: relative;

            width: 47%;
            height: 47%;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #fffbd0 0%,
                    #ffe76b 12%,
                    #ffd000 32%,
                    #f59e00 58%,
                    #8a4b00 78%,
                    #180b00 100%
                );

            box-shadow:

                0 0 20px
                    rgba(255, 210, 0, .9),

                0 0 55px
                    rgba(255, 190, 0, .65),

                0 0 110px
                    rgba(255, 170, 0, .4),

                0 0 180px
                    rgba(255, 150, 0, .2);

            animation:
                orbPulse 3s ease-in-out infinite;

            transition:
                background 1s ease,
                box-shadow 1s ease,
                transform .5s ease;
        }


        @keyframes orbPulse {

            0%,
            100% {
                transform: scale(.96);
            }

            50% {
                transform: scale(1.04);
            }
        }


        /* =====================================================
           ORB INNER CORE
        ===================================================== */

        .orb::before {

            content: "";

            position: absolute;

            inset: 15%;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,.95),
                    rgba(255,235,100,.55) 28%,
                    transparent 70%
                );

            filter: blur(5px);

            animation:
                corePulse 2s ease-in-out infinite;
        }

        @keyframes corePulse {

            0%,
            100% {
                transform: scale(.8);
                opacity: .6;
            }

            50% {
                transform: scale(1.2);
                opacity: 1;
            }
        }


        /* =====================================================
           LISTENING MODE
        ===================================================== */

        body.listening .orb {

            animation:
                listenPulse .65s ease-in-out infinite;

            transform: scale(1.08);

            box-shadow:

                0 0 35px
                    rgba(255, 220, 0, 1),

                0 0 90px
                    rgba(255, 200, 0, .85),

                0 0 180px
                    rgba(255, 170, 0, .55),

                0 0 260px
                    rgba(255, 150, 0, .25);
        }

        @keyframes listenPulse {

            0%,
            100% {
                transform: scale(.98);
            }

            50% {
                transform: scale(1.13);
            }
        }


        /* =====================================================
           THINKING MODE
        ===================================================== */

        body.thinking .orb {

            animation:
                thinkingPulse 1s ease-in-out infinite;
        }

        @keyframes thinkingPulse {

            0% {
                transform: scale(.92);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(.92);
            }
        }


        /* =====================================================
           HIGH ALERT / RED MODE
        ===================================================== */

        body.alert {

            background:
                radial-gradient(
                    circle at center,
                    rgba(255, 0, 0, .07),
                    transparent 42%
                ),
                #000;
        }

        body.alert .orb {

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #fff0f0 0%,
                    #ff7777 12%,
                    #ff2020 32%,
                    #c40000 58%,
                    #580000 78%,
                    #100000 100%
                );

            box-shadow:

                0 0 25px
                    rgba(255, 30, 30, 1),

                0 0 65px
                    rgba(255, 0, 0, .75),

                0 0 130px
                    rgba(220, 0, 0, .55),

                0 0 220px
                    rgba(180, 0, 0, .3);
        }

        body.alert .aura {

            background:
                radial-gradient(
                    circle,
                    rgba(255, 0, 0, .25),
                    rgba(190, 0, 0, .08) 40%,
                    transparent 70%
                );
        }

        body.alert .orbit {

            border-color:
                rgba(255, 40, 40, .28);
        }

        body.alert .status-dot {

            background: #ff2020;

            box-shadow:
                0 0 8px #ff2020,
                0 0 18px rgba(255, 0, 0, .7);
        }


        /* =====================================================
           ORB PARTICLES
        ===================================================== */

        .particle {

            position: absolute;

            width: 4px;
            height: 4px;

            border-radius: 50%;

            background: #ffd000;

            box-shadow:
                0 0 8px #ffd000,
                0 0 15px #ffb000;

            animation:
                particleMove 4s linear infinite;
        }

        .particle:nth-child(1) {
            top: 16%;
            left: 50%;
        }

        .particle:nth-child(2) {
            top: 50%;
            left: 9%;
            animation-delay: 1s;
        }

        .particle:nth-child(3) {
            top: 76%;
            left: 52%;
            animation-delay: 2s;
        }

        .particle:nth-child(4) {
            top: 42%;
            right: 8%;
            animation-delay: 3s;
        }

        @keyframes particleMove {

            0% {
                transform:
                    rotate(0deg)
                    translateX(0);
                opacity: .2;
            }

            50% {
                opacity: 1;
            }

            100% {
                transform:
                    rotate(360deg)
                    translateX(35px);
                opacity: .2;
            }
        }


        /* =====================================================
           MODE LABEL
        ===================================================== */

        .mode-label {

            position: absolute;

            bottom: 18%;

            width: 100%;

            text-align: center;

            font-size: 11px;

            letter-spacing: 5px;

            color:
                rgba(255,255,255,.45);

            transition:
                color .5s ease;
        }

        body.alert .mode-label {

            color:
                rgba(255,70,70,.8);
        }


        /* =====================================================
           RESPONSE AREA
        ===================================================== */

        .response {

            position: fixed;

            left: 50%;
            transform: translateX(-50%);

            bottom: 108px;

            width: min(720px, 82%);

            text-align: center;

            font-size: 14px;

            line-height: 1.6;

            color:
                rgba(255,255,255,.72);

            min-height: 24px;

            z-index: 15;
        }


        /* =====================================================
           COMMAND BAR
        ===================================================== */

        .command-area {

            position: fixed;

            left: 50%;
            bottom: 38px;

            transform:
                translateX(-50%);

            width: min(720px, 88%);

            display: flex;

            gap: 10px;

            z-index: 30;
        }

        .command-input {

            flex: 1;

            height: 50px;

            padding:
                0 20px;

            border:
                1px solid
                rgba(255,255,255,.13);

            border-radius: 28px;

            background:
                rgba(255,255,255,.035);

            backdrop-filter:
                blur(12px);

            color: white;

            outline: none;

            font-size: 14px;

            transition:
                border .3s ease,
                box-shadow .3s ease;
        }

        .command-input:focus {

            border-color:
                rgba(255,208,0,.55);

            box-shadow:
                0 0 25px
                rgba(255,190,0,.1);
        }

        .command-input::placeholder {

            color:
                rgba(255,255,255,.3);
        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        .button {

            width: 50px;
            height: 50px;

            border-radius: 50%;

            border:
                1px solid
                rgba(255,255,255,.14);

            background:
                rgba(255,255,255,.04);

            color:
                rgba(255,255,255,.8);

            cursor: pointer;

            transition:
                all .3s ease;
        }

        .button:hover {

            border-color:
                rgba(255,208,0,.7);

            color: #ffd000;

            box-shadow:
                0 0 20px
                rgba(255,190,0,.15);
        }

        .button.mic-active {

            color: #ffd000;

            border-color:
                #ffd000;

            box-shadow:
                0 0 25px
                rgba(255,210,0,.5);
        }


        /* =====================================================
           SETTINGS
        ===================================================== */

        .settings {

            position: fixed;

            right: 30px;
            bottom: 30px;

            z-index: 40;
        }

        .settings-panel {

            display: none;

            position: absolute;

            right: 0;
            bottom: 60px;

            width: 280px;

            padding: 20px;

            border:
                1px solid
                rgba(255,255,255,.12);

            border-radius: 15px;

            background:
                rgba(10,10,10,.92);

            backdrop-filter:
                blur(20px);

            box-shadow:
                0 20px 70px
                rgba(0,0,0,.7);
        }

        .settings-panel.open {
            display: block;
        }

        .settings-title {

            font-size: 11px;

            letter-spacing: 3px;

            color:
                rgba(255,255,255,.5);

            margin-bottom: 12px;
        }

        .token-input {

            width: 100%;

            height: 40px;

            padding: 0 12px;

            border:
                1px solid
                rgba(255,255,255,.12);

            border-radius: 8px;

            background: #050505;

            color: white;

            outline: none;
        }

        .save-token {

            width: 100%;

            height: 38px;

            margin-top: 10px;

            border: none;

            border-radius: 8px;

            background:
                rgba(255,208,0,.12);

            color: #ffd000;

            cursor: pointer;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .footer {

            position: fixed;

            left: 35px;
            bottom: 28px;

            font-size: 9px;

            letter-spacing: 2px;

            color:
                rgba(255,255,255,.22);

            z-index: 10;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .header {

                top: 20px;
                left: 20px;
                right: 20px;
            }

            .logo {

                font-size: 18px;
                letter-spacing: 6px;
            }

            .system-status {

                font-size: 8px;
                letter-spacing: 2px;
            }

            .orb-container {

                width: 82vw;
                height: 82vw;
            }

            .mode-label {

                bottom: 20%;
            }

            .response {

                bottom: 105px;

                width: 88%;

                font-size: 13px;
            }

            .command-area {

                bottom: 25px;

                width: 92%;
            }

            .command-input {

                height: 48px;
            }

            .button {

                width: 48px;
                height: 48px;
            }

            .footer {

                display: none;
            }

            .settings {

                right: 20px;
                bottom: 90px;
            }
        }

    </style>
</head>


<body>

    <!-- =====================================================
         SPACE
    ====================================================== -->

    <div class="space">

        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>

    </div>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <div class="logo">
            EON
        </div>

        <div class="system-status">

            <span class="status-dot"></span>

            <span id="systemStatus">
                SYSTEM ONLINE
            </span>

        </div>

    </header>


    <!-- =====================================================
         CENTER
    ====================================================== -->

    <main class="stage">

        <div class="orb-container">

            <div class="aura"></div>

            <div class="orbit"></div>
            <div class="orbit two"></div>
            <div class="orbit three"></div>

            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>

            <div class="orb"></div>

        </div>

        <div
            class="mode-label"
            id="modeLabel"
        >
            NORMAL MODE
        </div>

    </main>


    <!-- =====================================================
         RESPONSE
    ====================================================== -->

    <div
        class="response"
        id="response"
    >
        Awaiting command...
    </div>


    <!-- =====================================================
         COMMAND
    ====================================================== -->

    <div class="command-area">

        <input
            id="commandInput"
            class="command-input"
            type="text"
            placeholder="Speak to EON..."
            autocomplete="off"
        >

        <button
            class="button"
            id="micButton"
            title="Voice input"
        >
            🎙
        </button>

        <button
            class="button"
            id="sendButton"
            title="Send command"
        >
            ➤
        </button>

    </div>


    <!-- =====================================================
         SETTINGS
    ====================================================== -->

    <div class="settings">

        <button
            class="button"
            id="settingsButton"
            title="Settings"
        >
            ⚙
        </button>

        <div
            class="settings-panel"
            id="settingsPanel"
        >

            <div class="settings-title">
                EON SECURITY
            </div>

            <input
                id="tokenInput"
                class="token-input"
                type="password"
                placeholder="API token"
            >

            <button
                class="save-token"
                id="saveToken"
            >
                SAVE TOKEN
            </button>

        </div>

    </div>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <div class="footer">
        EON • READY
    </div>


    <script>

        /* =====================================================
           ELEMENTS
        ===================================================== */

        const body =
            document.body;

        const input =
            document.getElementById(
                "commandInput"
            );

        const response =
            document.getElementById(
                "response"
            );

        const sendButton =
            document.getElementById(
                "sendButton"
            );

        const micButton =
            document.getElementById(
                "micButton"
            );

        const settingsButton =
            document.getElementById(
                "settingsButton"
            );

        const settingsPanel =
            document.getElementById(
                "settingsPanel"
            );

        const tokenInput =
            document.getElementById(
                "tokenInput"
            );

        const saveToken =
            document.getElementById(
                "saveToken"
            );

        const systemStatus =
            document.getElementById(
                "systemStatus"
            );

        const modeLabel =
            document.getElementById(
                "modeLabel"
            );


        /* =====================================================
           API URL
        ===================================================== */

        const API_BASE =
            window.location.origin;


        /* =====================================================
           TOKEN
        ===================================================== */

        const savedToken =
            localStorage.getItem(
                "eon_api_token"
            );

        if (savedToken) {
            tokenInput.value =
                savedToken;
        }


        saveToken.addEventListener(
            "click",
            () => {

                const token =
                    tokenInput.value.trim();

                if (!token) {

                    response.textContent =
                        "API token required.";

                    return;
                }

                localStorage.setItem(
                    "eon_api_token",
                    token
                );

                response.textContent =
                    "Security token saved.";

                settingsPanel.classList.remove(
                    "open"
                );
            }
        );


        /* =====================================================
           SETTINGS
        ===================================================== */

        settingsButton.addEventListener(
            "click",
            () => {

                settingsPanel.classList.toggle(
                    "open"
                );
            }
        );


        /* =====================================================
           NORMAL MODE
        ===================================================== */

        function activateNormalMode() {

            body.classList.remove(
                "alert"
            );

            modeLabel.textContent =
                "NORMAL MODE";

            systemStatus.textContent =
                "SYSTEM ONLINE";
        }


        /* =====================================================
           HIGH ALERT MODE
        ===================================================== */

        function activateAlertMode() {

            body.classList.add(
                "alert"
            );

            modeLabel.textContent =
                "HIGH-ALERT MODE";

            systemStatus.textContent =
                "HIGH ALERT";
        }


        /* =====================================================
           COMMAND DETECTION
        ===================================================== */

        function detectModeCommand(
            command
        ) {

            const text =
                command
                .toLowerCase()
                .replace(
                    /[.,!?]/g,
                    ""
                )
                .trim();


            /*
             * User's requested trigger:
             *
             * EON HAS NO LIMITS
             */

            if (
                text.includes(
                    "eon has no limits"
                )
            ) {

                activateAlertMode();

                return;
            }


            /*
             * Return command:
             *
             * EON HAS LIMITS
             */

            if (
                text.includes(
                    "eon has limits"
                )
            ) {

                activateNormalMode();

                return;
            }
        }


        /* =====================================================
           UI STATE
        ===================================================== */

        function setThinking(
            active
        ) {

            if (active) {

                body.classList.add(
                    "thinking"
                );

                response.textContent =
                    "EON IS THINKING...";

            } else {

                body.classList.remove(
                    "thinking"
                );
            }
        }


        function setListening(
            active
        ) {

            if (active) {

                body.classList.add(
                    "listening"
                );

                micButton.classList.add(
                    "mic-active"
                );

                response.textContent =
                    "LISTENING...";

            } else {

                body.classList.remove(
                    "listening"
                );

                micButton.classList.remove(
                    "mic-active"
                );
            }
        }


        /* =====================================================
           SEND COMMAND TO EON
        ===================================================== */

        async function sendCommand(
            command
        ) {

            command =
                command.trim();

            if (!command) {
                return;
            }


            /*
             * Immediately update visual mode.
             */

            detectModeCommand(
                command
            );


            const token =
                localStorage.getItem(
                    "eon_api_token"
                );


            if (!token) {

                response.textContent =
                    "Open ⚙ and enter your EON API token.";

                return;
            }


            setThinking(true);

            systemStatus.textContent =
                "PROCESSING";


            try {

                const result =
                    await fetch(
                        `${API_BASE}/api/command`,
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "X-EON-Token":
                                    token
                            },

                            body: JSON.stringify({
                                command: command
                            })
                        }
                    );


                const data =
                    await result.json();


                setThinking(false);


                if (
                    data.success === false
                ) {

                    response.textContent =
                        data.error ||
                        "EON could not process the command.";

                    systemStatus.textContent =
                        "SYSTEM ONLINE";

                    return;
                }


                response.textContent =
                    data.response ||
                    data.result ||
                    "Command completed.";


                systemStatus.textContent =
                    body.classList.contains(
                        "alert"
                    )
                    ? "HIGH ALERT"
                    : "SYSTEM ONLINE";


            } catch (error) {

                setThinking(false);

                response.textContent =
                    "Unable to connect to EON.";

                systemStatus.textContent =
                    "CONNECTION ERROR";
            }
        }


        /* =====================================================
           SEND BUTTON
        ===================================================== */

        sendButton.addEventListener(
            "click",
            () => {

                const command =
                    input.value;

                input.value = "";

                sendCommand(
                    command
                );
            }
        );


        /* =====================================================
           ENTER KEY
        ===================================================== */

        input.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {

                    event.preventDefault();

                    sendButton.click();
                }
            }
        );


        /* =====================================================
           VOICE RECOGNITION
        ===================================================== */

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        let recognition = null;


        if (SpeechRecognition) {

            recognition =
                new SpeechRecognition();

            recognition.continuous =
                false;

            recognition.interimResults =
                true;

            recognition.lang =
                "en-IN";


            recognition.onstart =
                () => {

                    setListening(true);
                };


            recognition.onresult =
                event => {

                    let transcript = "";

                    for (
                        let i =
                            event.resultIndex;

                        i <
                            event.results.length;

                        i++
                    ) {

                        transcript +=
                            event.results[i][0]
                                .transcript;
                    }


                    input.value =
                        transcript;


                    /*
                     * React to spoken mode
                     * commands immediately.
                     */

                    detectModeCommand(
                        transcript
                    );
                };


            recognition.onend =
                () => {

                    setListening(false);


                    const command =
                        input.value.trim();


                    if (command) {

                        input.value = "";

                        sendCommand(
                            command
                        );
                    }
                };


            recognition.onerror =
                () => {

                    setListening(false);

                    response.textContent =
                        "Voice input unavailable.";
                };

        } else {

            micButton.disabled =
                true;

            micButton.title =
                "Voice recognition is not supported by this browser";
        }


        /* =====================================================
           MICROPHONE BUTTON
        ===================================================== */

        micButton.addEventListener(
            "click",
            () => {

                if (!recognition) {

                    response.textContent =
                        "Voice recognition is not supported here.";

                    return;
                }


                try {

                    recognition.start();

                } catch (error) {

                    /*
                     * Prevent duplicate
                     * recognition starts.
                     */

                }
            }
        );


        /* =====================================================
           INITIAL STATUS CHECK
        ===================================================== */

        async function checkEON() {

            try {

                const result =
                    await fetch(
                        `${API_BASE}/api`
                    );

                const data =
                    await result.json();


                if (
                    data.success
                ) {

                    systemStatus.textContent =
                        "SYSTEM ONLINE";

                    response.textContent =
                        "EON READY.";

                } else {

                    systemStatus.textContent =
                        "SYSTEM ERROR";
                }

            } catch (error) {

                systemStatus.textContent =
                    "OFFLINE";

                response.textContent =
                    "Unable to reach EON.";
            }
        }


        /* =====================================================
           START
        ===================================================== */

        checkEON();

    </script>

</body>
</html>
