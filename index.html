<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>EON — Executive Orchestration Network</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        :root {

            --gold: #ffd84a;
            --gold-bright: #fff4a8;
            --gold-dark: #8f6f00;

            --red: #ff2d2d;
            --red-bright: #ff8a8a;

            --bg: #000000;

            --orb-color: #ffd84a;
            --orb-bright: #fff4a8;
            --orb-dark: #8f6f00;

        }


        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;

            color: white;

            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;

        }


        body {

            position: relative;

        }


        /* =========================================================
           BACKGROUND
        ========================================================= */

        .background {

            position: fixed;

            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    rgba(255, 216, 74, 0.035),
                    transparent 42%
                ),
                #000;

            pointer-events: none;

        }


        .stars {

            position: fixed;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

        }


        .star {

            position: absolute;

            width: 2px;
            height: 2px;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.55);

            animation:
                starFloat linear infinite;

        }


        @keyframes starFloat {

            from {

                transform:
                    translateY(0);

                opacity:
                    0.15;

            }


            50% {

                opacity:
                    0.7;

            }


            to {

                transform:
                    translateY(-120px);

                opacity:
                    0.1;

            }

        }


        /* =========================================================
           TOP BAR
        ========================================================= */

        .top-bar {

            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            height: 72px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 28px;

            z-index: 50;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.75),
                    rgba(0, 0, 0, 0)
                );

        }


        .brand {

            font-size: 18px;

            font-weight: 700;

            letter-spacing: 7px;

            color:
                var(--orb-color);

            text-shadow:
                0 0 8px var(--orb-color),
                0 0 20px rgba(255, 216, 74, 0.35);

        }


        .connection {

            display: flex;

            align-items: center;

            gap: 9px;

            font-size: 11px;

            letter-spacing: 2px;

            color:
                rgba(255, 255, 255, 0.55);

        }


        .connection-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #777;

            box-shadow:
                0 0 8px #777;

            transition:
                0.3s ease;

        }


        .connection.online
        .connection-dot {

            background:
                var(--orb-color);

            box-shadow:
                0 0 8px var(--orb-color),
                0 0 18px var(--orb-color);

        }


        .connection.offline
        .connection-dot {

            background:
                var(--red);

            box-shadow:
                0 0 12px var(--red);

        }


        /* =========================================================
           MAIN
        ========================================================= */

        .main {

            position: fixed;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 5;

        }


        /* =========================================================
           EON CORE
        ========================================================= */

        .core {

            position: relative;

            width:
                min(72vw, 650px);

            height:
                min(72vw, 650px);

            display: flex;

            align-items: center;

            justify-content: center;

            --core-size:
                min(72vw, 650px);

        }


        .core::before {

            content: "";

            position: absolute;

            inset: 4%;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 216, 74, 0.07),
                    transparent 55%
                );

            filter:
                blur(25px);

            opacity:
                0.8;

            transition:
                background 0.6s ease,
                opacity 0.6s ease;

        }


        /* =========================================================
           ORBIT RINGS
        ========================================================= */

        .ring {

            position: absolute;

            border-radius: 50%;

            border:
                1px solid
                rgba(255, 216, 74, 0.28);

            box-shadow:
                0 0 10px rgba(255, 216, 74, 0.12),
                inset 0 0 10px rgba(255, 216, 74, 0.06);

            transition:
                border-color 0.5s ease,
                box-shadow 0.5s ease;

        }


        .ring-1 {

            width: 58%;
            height: 58%;

            animation:
                rotateClockwise
                22s
                linear
                infinite;

        }


        .ring-2 {

            width: 68%;
            height: 68%;

            border-style:
                dashed;

            animation:
                rotateCounter
                28s
                linear
                infinite;

        }


        .ring-3 {

            width: 78%;
            height: 78%;

            opacity:
                0.75;

            animation:
                rotateClockwise
                36s
                linear
                infinite;

        }


        .ring-4 {

            width: 90%;
            height: 90%;

            border-color:
                rgba(255, 216, 74, 0.12);

            animation:
                rotateCounter
                48s
                linear
                infinite;

        }


        @keyframes rotateClockwise {

            from {

                transform:
                    rotate(0deg);

            }

            to {

                transform:
                    rotate(360deg);

            }

        }


        @keyframes rotateCounter {

            from {

                transform:
                    rotate(360deg);

            }

            to {

                transform:
                    rotate(0deg);

            }

        }


        /* =========================================================
           HOLLOW CORE
        ========================================================= */

        .hollow-core {

            position: relative;

            width: 42%;
            height: 42%;

            border-radius: 50%;

            border:
                2px solid
                var(--orb-color);

            background:
                radial-gradient(
                    circle at center,
                    rgba(255, 216, 74, 0.045),
                    rgba(0, 0, 0, 0.96) 67%
                );

            box-shadow:
                0 0 12px var(--orb-color),
                0 0 35px rgba(255, 216, 74, 0.35),
                inset 0 0 25px rgba(255, 216, 74, 0.1);

            display: flex;

            align-items: center;

            justify-content: center;

            transition:
                border-color 0.55s ease,
                box-shadow 0.55s ease,
                background 0.55s ease;

            z-index: 10;

        }


        .hollow-core::before {

            content: "";

            position: absolute;

            inset: -8%;

            border-radius: 50%;

            border:
                1px solid
                rgba(255, 216, 74, 0.25);

            animation:
                pulseRing
                3s
                ease-in-out
                infinite;

        }


        .hollow-core::after {

            content: "";

            position: absolute;

            inset: -17%;

            border-radius: 50%;

            border:
                1px solid
                rgba(255, 216, 74, 0.08);

            animation:
                pulseRing
                4.5s
                ease-in-out
                infinite
                reverse;

        }


        @keyframes pulseRing {

            0%,
            100% {

                transform:
                    scale(0.96);

                opacity:
                    0.25;

            }


            50% {

                transform:
                    scale(1.04);

                opacity:
                    0.75;

            }

        }


        /* =========================================================
           EON TEXT
        ========================================================= */

        .eon-text {

            font-size:
                clamp(
                    35px,
                    6vw,
                    72px
                );

            font-weight:
                800;

            letter-spacing:
                12px;

            color:
                var(--orb-bright);

            text-shadow:
                0 0 8px var(--orb-color),
                0 0 25px var(--orb-color),
                0 0 55px rgba(255, 216, 74, 0.5);

            user-select:
                none;

            transform:
                translateX(6px);

            transition:
                color 0.5s ease,
                text-shadow 0.5s ease,
                transform 0.3s ease;

        }


        /* =========================================================
           ORBIT PARTICLES
        ========================================================= */

        .particle {

            position: absolute;

            width: 4px;
            height: 4px;

            border-radius: 50%;

            background:
                var(--orb-color);

            box-shadow:
                0 0 6px var(--orb-color),
                0 0 14px var(--orb-color);

            transform-origin:
                center;

            transition:
                background 0.5s ease;

        }


        .p1 {

            animation:
                orbit1
                7s
                linear
                infinite;

        }


        .p2 {

            animation:
                orbit2
                11s
                linear
                infinite;

        }


        .p3 {

            animation:
                orbit3
                15s
                linear
                infinite;

        }


        .p4 {

            animation:
                orbit4
                19s
                linear
                infinite;

        }


        @keyframes orbit1 {

            from {

                transform:
                    rotate(0deg)
                    translateX(245px)
                    rotate(0deg);

            }


            to {

                transform:
                    rotate(360deg)
                    translateX(245px)
                    rotate(-360deg);

            }

        }


        @keyframes orbit2 {

            from {

                transform:
                    rotate(0deg)
                    translateX(205px)
                    rotate(0deg);

            }


            to {

                transform:
                    rotate(-360deg)
                    translateX(205px)
                    rotate(360deg);

            }

        }


        @keyframes orbit3 {

            from {

                transform:
                    rotate(0deg)
                    translateX(170px)
                    rotate(0deg);

            }


            to {

                transform:
                    rotate(360deg)
                    translateX(170px)
                    rotate(-360deg);

            }

        }


        @keyframes orbit4 {

            from {

                transform:
                    rotate(0deg)
                    translateX(135px)
                    rotate(0deg);

            }


            to {

                transform:
                    rotate(-360deg)
                    translateX(135px)
                    rotate(360deg);

            }

        }


        /* =========================================================
           PARTICLE FIELD
        ========================================================= */

        .particle-field {

            position: absolute;

            inset: -10%;

            pointer-events:
                none;

        }


        .field-particle {

            position: absolute;

            width: 2px;
            height: 2px;

            border-radius: 50%;

            background:
                var(--orb-color);

            opacity:
                0.4;

            box-shadow:
                0 0 6px var(--orb-color);

            animation:
                fieldFloat
                var(--duration)
                ease-in-out
                infinite;

        }


        @keyframes fieldFloat {

            0%,
            100% {

                transform:
                    translate(0, 0);

                opacity:
                    0.1;

            }


            50% {

                transform:
                    translate(
                        var(--x),
                        var(--y)
                    );

                opacity:
                    0.75;

            }

        }


        /* =========================================================
           NO LIMITS MODE
        ========================================================= */

        body.no-limits {

            --orb-color:
                #ff2525;

            --orb-bright:
                #ffb0b0;

            --orb-dark:
                #7a0000;

        }


        body.no-limits
        .core::before {

            background:
                radial-gradient(
                    circle,
                    rgba(255, 30, 30, 0.08),
                    transparent 55%
                );

        }


        body.no-limits
        .ring {

            border-color:
                rgba(255, 40, 40, 0.32);

            box-shadow:
                0 0 12px rgba(255, 30, 30, 0.18),
                inset 0 0 10px rgba(255, 30, 30, 0.08);

        }


        body.no-limits
        .hollow-core {

            background:
                radial-gradient(
                    circle,
                    rgba(255, 30, 30, 0.07),
                    rgba(0, 0, 0, 0.97) 67%
                );

            box-shadow:
                0 0 15px #ff2525,
                0 0 45px rgba(255, 30, 30, 0.45),
                inset 0 0 30px rgba(255, 30, 30, 0.12);

        }


        body.no-limits
        .eon-text {

            text-shadow:
                0 0 8px #ff2525,
                0 0 25px #ff2525,
                0 0 65px rgba(255, 30, 30, 0.6);

        }


        /* =========================================================
           STATUS
        ========================================================= */

        .status {

            position: fixed;

            bottom: 95px;

            left: 50%;

            transform:
                translateX(-50%);

            z-index: 40;

            display: flex;

            align-items: center;

            gap: 10px;

            font-size: 10px;

            letter-spacing: 3px;

            color:
                rgba(255, 255, 255, 0.45);

            transition:
                color 0.4s ease;

        }


        .status-dot {

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background:
                var(--orb-color);

            box-shadow:
                0 0 8px var(--orb-color);

        }


        /* =========================================================
           CONTROLS
        ========================================================= */

        .controls {

            position: fixed;

            right: 25px;

            bottom: 25px;

            display: flex;

            gap: 9px;

            z-index: 50;

        }


        .control-button {

            width: 42px;
            height: 42px;

            border-radius: 50%;

            border:
                1px solid
                rgba(255, 255, 255, 0.14);

            background:
                rgba(255, 255, 255, 0.025);

            color:
                rgba(255, 255, 255, 0.6);

            cursor:
                pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 16px;

            transition:
                0.25s ease;

        }


        .control-button:hover {

            color:
                var(--orb-color);

            border-color:
                var(--orb-color);

            box-shadow:
                0 0 15px
                rgba(255, 216, 74, 0.2);

            transform:
                translateY(-2px);

        }


        /* =========================================================
           COMMAND BAR
        ========================================================= */

        .command-container {

            position: fixed;

            left: 50%;

            bottom: 24px;

            transform:
                translateX(-50%);

            width:
                min(650px, 70vw);

            z-index: 50;

            display: flex;

            gap: 8px;

        }


        .command-input {

            flex: 1;

            height: 46px;

            border-radius: 25px;

            border:
                1px solid
                rgba(255, 255, 255, 0.13);

            outline: none;

            background:
                rgba(0, 0, 0, 0.72);

            backdrop-filter:
                blur(15px);

            color: white;

            padding:
                0 20px;

            font-size: 13px;

            letter-spacing:
                0.3px;

            transition:
                0.25s ease;

        }


        .command-input::placeholder {

            color:
                rgba(255, 255, 255, 0.25);

        }


        .command-input:focus {

            border-color:
                var(--orb-color);

            box-shadow:
                0 0 20px
                rgba(255, 216, 74, 0.08);

        }


        .send-button {

            width: 46px;
            height: 46px;

            border-radius: 50%;

            border:
                1px solid
                var(--orb-color);

            background:
                rgba(255, 216, 74, 0.06);

            color:
                var(--orb-color);

            cursor:
                pointer;

            font-size:
                17px;

            transition:
                0.25s ease;

        }


        .send-button:hover {

            background:
                rgba(255, 216, 74, 0.16);

            box-shadow:
                0 0 20px
                rgba(255, 216, 74, 0.25);

            transform:
                scale(1.05);

        }


        /* =========================================================
           LISTENING
        ========================================================= */

        body.listening
        .hollow-core {

            animation:
                listeningPulse
                1.2s
                ease-in-out
                infinite;

        }


        body.listening
        .eon-text {

            transform:
                translateX(6px)
                scale(1.04);

        }


        @keyframes listeningPulse {

            0%,
            100% {

                transform:
                    scale(1);

            }


            50% {

                transform:
                    scale(1.045);

            }

        }


        /* =========================================================
           THINKING
        ========================================================= */

        body.thinking
        .ring-1 {

            animation-duration:
                3s;

        }


        body.thinking
        .ring-2 {

            animation-duration:
                4s;

        }


        body.thinking
        .ring-3 {

            animation-duration:
                5s;

        }


        body.thinking
        .hollow-core {

            box-shadow:
                0 0 18px var(--orb-color),
                0 0 60px rgba(255, 216, 74, 0.42),
                inset 0 0 35px rgba(255, 216, 74, 0.13);

        }


        /* =========================================================
           SPEAKING
        ========================================================= */

        body.speaking
        .hollow-core {

            animation:
                speakingPulse
                0.55s
                ease-in-out
                infinite;

        }


        @keyframes speakingPulse {

            0%,
            100% {

                transform:
                    scale(1);

            }


            50% {

                transform:
                    scale(1.065);

            }

        }


        /* =========================================================
           ALERT
        ========================================================= */

        body.alert
        .hollow-core {

            animation:
                alertPulse
                0.25s
                ease-in-out
                infinite;

        }


        @keyframes alertPulse {

            0%,
            100% {

                transform:
                    scale(1);

            }


            50% {

                transform:
                    scale(1.09);

            }

        }


        /* =========================================================
           MODE BURST
        ========================================================= */

        .burst {

            position: fixed;

            left: 50%;
            top: 50%;

            width: 20px;
            height: 20px;

            border-radius: 50%;

            border:
                2px solid
                var(--orb-color);

            transform:
                translate(-50%, -50%)
                scale(0);

            opacity:
                0;

            pointer-events:
                none;

            z-index: 20;

        }


        .burst.active {

            animation:
                burstAnimation
                0.9s
                ease-out
                forwards;

        }


        @keyframes burstAnimation {

            0% {

                transform:
                    translate(-50%, -50%)
                    scale(0);

                opacity:
                    0.95;

            }


            70% {

                opacity:
                    0.45;

            }


            100% {

                transform:
                    translate(-50%, -50%)
                    scale(35);

                opacity:
                    0;

            }

        }


        .flash {

            position: fixed;

            inset: 0;

            background:
                var(--orb-color);

            opacity:
                0;

            pointer-events:
                none;

            z-index: 100;

        }


        .flash.active {

            animation:
                flashAnimation
                0.35s
                ease-out;

        }


        @keyframes flashAnimation {

            0% {

                opacity:
                    0;

            }


            20% {

                opacity:
                    0.12;

            }


            100% {

                opacity:
                    0;

            }

        }


        /* =========================================================
           RESPONSE PANEL
        ========================================================= */

        .response-panel {

            position: fixed;

            left: 50%;

            top: 77%;

            transform:
                translate(-50%, -50%)
                translateY(20px);

            width:
                min(620px, 72vw);

            max-height:
                110px;

            overflow-y:
                auto;

            padding:
                12px 18px;

            border-radius:
                15px;

            border:
                1px solid
                rgba(255, 216, 74, 0.08);

            background:
                rgba(0, 0, 0, 0.42);

            backdrop-filter:
                blur(12px);

            color:
                rgba(255, 255, 255, 0.65);

            font-size:
                12px;

            line-height:
                1.55;

            text-align:
                center;

            opacity:
                0;

            pointer-events:
                none;

            transition:
                0.35s ease;

            z-index:
                30;

        }


        .response-panel.show {

            opacity:
                1;

            transform:
                translate(-50%, -50%)
                translateY(0);

        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 700px) {

            .top-bar {

                padding:
                    0 17px;

            }


            .brand {

                font-size:
                    15px;

                letter-spacing:
                    5px;

            }


            .connection {

                font-size:
                    9px;

                letter-spacing:
                    1.5px;

            }


            .core {

                width:
                    90vw;

                height:
                    90vw;

            }


            .command-container {

                width:
                    82vw;

                bottom:
                    20px;

            }


            .controls {

                right:
                    15px;

                bottom:
                    78px;

            }


            .status {

                bottom:
                    80px;

            }


            .response-panel {

                width:
                    82vw;

                top:
                    73%;

            }


            .eon-text {

                letter-spacing:
                    7px;

            }

        }


        @media (max-height: 650px) {

            .response-panel {

                display:
                    none;

            }


            .status {

                bottom:
                    75px;

            }


            .command-container {

                bottom:
                    15px;

            }

        }

    </style>

</head>


<body>


    <div class="background"></div>


    <!-- =========================================================
         STARS
    ========================================================== -->

    <div
        class="stars"
        id="stars"
    ></div>


    <!-- =========================================================
         TOP BAR
    ========================================================== -->

    <header class="top-bar">

        <div class="brand">
            EON
        </div>


        <div
            class="connection"
            id="connection"
        >

            <span
                class="connection-dot"
            ></span>


            <span
                id="connectionText"
            >
                CONNECTING
            </span>

        </div>

    </header>


    <!-- =========================================================
         MAIN EON CORE
    ========================================================== -->

    <main class="main">

        <div
            class="core"
            id="core"
        >

            <div
                class="particle-field"
                id="particleField"
            ></div>


            <div
                class="ring ring-4"
            ></div>

            <div
                class="ring ring-3"
            ></div>

            <div
                class="ring ring-2"
            ></div>

            <div
                class="ring ring-1"
            ></div>


            <div
                class="particle p1"
            ></div>

            <div
                class="particle p2"
            ></div>

            <div
                class="particle p3"
            ></div>

            <div
                class="particle p4"
            ></div>


            <div class="hollow-core">

                <div class="eon-text">
                    EON
                </div>

            </div>

        </div>

    </main>


    <!-- =========================================================
         RESPONSE
    ========================================================== -->

    <div
        class="response-panel"
        id="responsePanel"
    ></div>


    <!-- =========================================================
         STATUS
    ========================================================== -->

    <div class="status">

        <span
            class="status-dot"
        ></span>


        <span
            id="statusText"
        >
            EON ONLINE
        </span>

    </div>


    <!-- =========================================================
         CONTROLS
    ========================================================== -->

    <div class="controls">


        <button
            class="control-button"
            id="micButton"
            title="Voice"
        >
            🎙
        </button>


        <button
            class="control-button"
            id="statusButton"
            title="System Status"
        >
            ◉
        </button>


        <button
            class="control-button"
            id="resetButton"
            title="Reset Session"
        >
            ↻
        </button>


        <button
            class="control-button"
            id="fullscreenButton"
            title="Fullscreen"
        >
            ⛶
        </button>

    </div>


    <!-- =========================================================
         COMMAND BAR
    ========================================================== -->

    <div
        class="command-container"
    >

        <input
            id="commandInput"
            class="command-input"
            type="text"
            autocomplete="off"
            placeholder="Speak to EON..."
        >


        <button
            id="sendButton"
            class="send-button"
            title="Send"
        >
            ➤
        </button>

    </div>


    <!-- =========================================================
         MODE EFFECTS
    ========================================================== -->

    <div
        class="burst"
        id="burst"
    ></div>


    <div
        class="flash"
        id="flash"
    ></div>



    <script>


        /* =========================================================
           DOM
        ========================================================= */

        const body =
            document.body;


        const commandInput =
            document.getElementById(
                "commandInput"
            );


        const sendButton =
            document.getElementById(
                "sendButton"
            );


        const micButton =
            document.getElementById(
                "micButton"
            );


        const statusButton =
            document.getElementById(
                "statusButton"
            );


        const resetButton =
            document.getElementById(
                "resetButton"
            );


        const fullscreenButton =
            document.getElementById(
                "fullscreenButton"
            );


        const statusText =
            document.getElementById(
                "statusText"
            );


        const connection =
            document.getElementById(
                "connection"
            );


        const connectionText =
            document.getElementById(
                "connectionText"
            );


        const responsePanel =
            document.getElementById(
                "responsePanel"
            );


        const burst =
            document.getElementById(
                "burst"
            );


        const flash =
            document.getElementById(
                "flash"
            );


        const particleField =
            document.getElementById(
                "particleField"
            );



        /* =========================================================
           STAR GENERATION
        ========================================================= */

        function createStars() {

            const stars =
                document.getElementById(
                    "stars"
                );


            const count =
                window.innerWidth < 700
                    ? 65
                    : 120;


            for (
                let i = 0;
                i < count;
                i++
            ) {

                const star =
                    document.createElement(
                        "div"
                    );


                star.className =
                    "star";


                star.style.left =
                    Math.random() * 100 + "%";


                star.style.top =
                    Math.random() * 100 + "%";


                const size =
                    Math.random() * 2 + 1;


                star.style.width =
                    size + "px";


                star.style.height =
                    size + "px";


                star.style.animationDuration =
                    (
                        5 +
                        Math.random() * 10
                    ) + "s";


                star.style.animationDelay =
                    (
                        -Math.random() * 10
                    ) + "s";


                stars.appendChild(
                    star
                );

            }

        }



        /* =========================================================
           PARTICLES
        ========================================================= */

        function createParticles() {

            const count =
                window.innerWidth < 700
                    ? 20
                    : 35;


            for (
                let i = 0;
                i < count;
                i++
            ) {

                const particle =
                    document.createElement(
                        "div"
                    );


                particle.className =
                    "field-particle";


                particle.style.left =
                    Math.random() * 100 + "%";


                particle.style.top =
                    Math.random() * 100 + "%";


                particle.style.setProperty(
                    "--x",
                    (
                        (Math.random() - 0.5) *
                        100
                    ) + "px"
                );


                particle.style.setProperty(
                    "--y",
                    (
                        (Math.random() - 0.5) *
                        100
                    ) + "px"
                );


                particle.style.setProperty(
                    "--duration",
                    (
                        4 +
                        Math.random() * 7
                    ) + "s"
                );


                particle.style.animationDelay =
                    (
                        -Math.random() * 8
                    ) + "s";


                particleField.appendChild(
                    particle
                );

            }

        }


        createStars();

        createParticles();



        /* =========================================================
           AUDIO
        ========================================================= */

        let eonAudio =
            null;


        function getEONAudio() {

            if (!eonAudio) {

                const AudioContext =
                    window.AudioContext ||
                    window.webkitAudioContext;


                if (!AudioContext) {

                    return null;

                }


                eonAudio =
                    new AudioContext();

            }


            if (
                eonAudio.state ===
                "suspended"
            ) {

                eonAudio.resume();

            }


            return eonAudio;

        }



        /* =========================================================
           NORMAL MODE SOUND
        ========================================================= */

        function playNormalModeSound() {

            try {

                const audio =
                    getEONAudio();


                if (!audio) {
                    return;
                }


                const now =
                    audio.currentTime;


                const oscillator =
                    audio.createOscillator();


                const gain =
                    audio.createGain();


                oscillator.type =
                    "sine";


                oscillator.frequency.setValueAtTime(
                    180,
                    now
                );


                oscillator.frequency.exponentialRampToValueAtTime(
                    520,
                    now + 0.45
                );


                gain.gain.setValueAtTime(
                    0.0001,
                    now
                );


                gain.gain.exponentialRampToValueAtTime(
                    0.18,
                    now + 0.08
                );


                gain.gain.exponentialRampToValueAtTime(
                    0.0001,
                    now + 0.65
                );


                oscillator.connect(
                    gain
                );


                gain.connect(
                    audio.destination
                );


                oscillator.start(
                    now
                );


                oscillator.stop(
                    now + 0.7
                );

            } catch (error) {

                console.warn(
                    "Audio unavailable:",
                    error
                );

            }

        }



        /* =========================================================
           NO LIMITS SOUND
        ========================================================= */

        function playNoLimitsSound() {

            try {

                const audio =
                    getEONAudio();


                if (!audio) {
                    return;
                }


                const now =
                    audio.currentTime;


                const oscillator =
                    audio.createOscillator();


                const gain =
                    audio.createGain();


                oscillator.type =
                    "sawtooth";


                oscillator.frequency.setValueAtTime(
                    90,
                    now
                );


                oscillator.frequency.exponentialRampToValueAtTime(
                    780,
                    now + 0.25
                );


                gain.gain.setValueAtTime(
                    0.0001,
                    now
                );


                gain.gain.exponentialRampToValueAtTime(
                    0.3,
                    now + 0.04
                );


                gain.gain.exponentialRampToValueAtTime(
                    0.0001,
                    now + 0.8
                );


                oscillator.connect(
                    gain
                );


                gain.connect(
                    audio.destination
                );


                oscillator.start(
                    now
                );


                oscillator.stop(
                    now + 0.85
                );


                const burstOsc =
                    audio.createOscillator();


                const burstGain =
                    audio.createGain();


                burstOsc.type =
                    "square";


                burstOsc.frequency.setValueAtTime(
                    1200,
                    now
                );


                burstOsc.frequency.exponentialRampToValueAtTime(
                    220,
                    now + 0.35
                );


                burstGain.gain.setValueAtTime(
                    0.0001,
                    now
                );


                burstGain.gain.exponentialRampToValueAtTime(
                    0.12,
                    now + 0.02
                );


                burstGain.gain.exponentialRampToValueAtTime(
                    0.0001,
                    now + 0.4
                );


                burstOsc.connect(
                    burstGain
                );


                burstGain.connect(
                    audio.destination
                );


                burstOsc.start(
                    now
                );


                burstOsc.stop(
                    now + 0.45
                );

            } catch (error) {

                console.warn(
                    "Audio unavailable:",
                    error
                );

            }

        }



        function playModeSound(
            mode
        ) {

            if (
                mode ===
                "NO_LIMITS"
            ) {

                playNoLimitsSound();

            } else {

                playNormalModeSound();

            }

        }



        /* =========================================================
           BURST
        ========================================================= */

        function triggerBurst() {

            burst.classList.remove(
                "active"
            );


            flash.classList.remove(
                "active"
            );


            void burst.offsetWidth;

            void flash.offsetWidth;


            burst.classList.add(
                "active"
            );


            flash.classList.add(
                "active"
            );


            setTimeout(
                () => {

                    burst.classList.remove(
                        "active"
                    );

                    flash.classList.remove(
                        "active"
                    );

                },
                1000
            );

        }



        /* =========================================================
           MODE
        ========================================================= */

        let currentMode =
            "NORMAL";


        function setMode(
            mode
        ) {

            if (
                mode ===
                currentMode
            ) {

                return;

            }


            currentMode =
                mode;


            triggerBurst();


            playModeSound(
                mode
            );


            if (
                mode ===
                "NO_LIMITS"
            ) {

                body.classList.add(
                    "no-limits"
                );


                body.classList.add(
                    "alert"
                );


                statusText.textContent =
                    "HIGH ALERT";

            } else {

                body.classList.remove(
                    "no-limits"
                );


                body.classList.remove(
                    "alert"
                );


                statusText.textContent =
                    "EON ONLINE";

            }

        }



        /* =========================================================
           MODE COMMAND DETECTION
        ========================================================= */

        function detectModeCommand(
            text
        ) {

            const command =
                text
                    .toLowerCase()
                    .trim();


            if (
                command.includes(
                    "eon has no limits"
                )
            ) {

                setMode(
                    "NO_LIMITS"
                );


                return true;

            }


            if (
                command.includes(
                    "eon has limits"
                )
            ) {

                setMode(
                    "NORMAL"
                );


                return true;

            }


            return false;

        }



        /* =========================================================
           SPEECH
        ========================================================= */

        function speak(
            text
        ) {

            if (
                !(
                    "speechSynthesis"
                    in window
                )
            ) {

                return;

            }


            window.speechSynthesis.cancel();


            const utterance =
                new SpeechSynthesisUtterance(
                    text
                );


            utterance.lang =
                "en-IN";


            utterance.rate =
                currentMode ===
                "NO_LIMITS"
                    ? 0.88
                    : 0.96;


            utterance.pitch =
                currentMode ===
                "NO_LIMITS"
                    ? 0.55
                    : 0.9;


            body.classList.add(
                "speaking"
            );


            utterance.onend =
                () => {

                    body.classList.remove(
                        "speaking"
                    );

                };


            utterance.onerror =
                () => {

                    body.classList.remove(
                        "speaking"
                    );

                };


            window.speechSynthesis.speak(
                utterance
            );

        }



        /* =========================================================
           RESPONSE DISPLAY
        ========================================================= */

        function showResponse(
            text
        ) {

            responsePanel.textContent =
                text;


            responsePanel.classList.add(
                "show"
            );


            clearTimeout(
                window.eonResponseTimer
            );


            window.eonResponseTimer =
                setTimeout(
                    () => {

                        responsePanel.classList.remove(
                            "show"
                        );

                    },
                    9000
                );

        }



        /* =========================================================
           EON COMMAND
        ========================================================= */

        async function sendCommand(
            command
        ) {

            const cleanCommand =
                command.trim();


            if (
                !cleanCommand
            ) {

                return;

            }


            body.classList.remove(
                "listening"
            );


            body.classList.add(
                "thinking"
            );


            statusText.textContent =
                "EON THINKING";


            showResponse(
                "Processing..."
            );


            detectModeCommand(
                cleanCommand
            );


            try {

                const response =
                    await fetch(
                        "/api/command",
                        {
                            method:
                                "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    command:
                                        cleanCommand
                                })
                        }
                    );


                let data;


                try {

                    data =
                        await response.json();

                } catch (jsonError) {

                    throw new Error(
                        "Invalid response from EON server."
                    );

                }


                body.classList.remove(
                    "thinking"
                );


                /* =========================================
                   SUCCESS
                ========================================= */

                if (
                    response.ok &&
                    data.success
                ) {

                    const result =
                        data.response;


                    const text =
                        typeof result ===
                        "string"

                            ? result

                            : JSON.stringify(
                                result
                            );


                    showResponse(
                        text ||
                        "EON completed the request."
                    );


                    statusText.textContent =
                        currentMode ===
                        "NO_LIMITS"

                            ? "HIGH ALERT"

                            : "EON ONLINE";


                    if (
                        text
                    ) {

                        speak(
                            text
                        );

                    }


                    return;

                }


                /* =========================================
                   BACKEND ERROR
                ========================================= */

                let errorMessage =
                    data.error ||
                    "EON encountered an error.";


                if (
                    data.type
                ) {

                    errorMessage +=
                        " [" +
                        data.type +
                        "]";

                }


                console.error(
                    "EON Backend Error:",
                    data
                );


                /*
                 * If the backend supplied a traceback,
                 * keep it in the browser console rather
                 * than flooding the visual interface.
                 */

                if (
                    data.traceback
                ) {

                    console.error(
                        "EON Traceback:\n" +
                        data.traceback
                    );

                }


                showResponse(
                    errorMessage
                );


                statusText.textContent =
                    "SYSTEM ERROR";


            } catch (error) {

                console.error(
                    "EON Connection Error:",
                    error
                );


                body.classList.remove(
                    "thinking"
                );


                showResponse(
                    "Unable to connect to EON Core: " +
                    error.message
                );


                statusText.textContent =
                    "CONNECTION ERROR";

            }

        }



        /* =========================================================
           SEND BUTTON
        ========================================================= */

        sendButton.addEventListener(
            "click",
            () => {

                const command =
                    commandInput.value;


                if (
                    !command.trim()
                ) {

                    return;

                }


                commandInput.value =
                    "";


                sendCommand(
                    command
                );

            }
        );



        /* =========================================================
           ENTER
        ========================================================= */

        commandInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {

                    event.preventDefault();

                    sendButton.click();

                }

            }
        );



        /* =========================================================
           SPEECH RECOGNITION
        ========================================================= */

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        let recognition =
            null;


        let isListening =
            false;


        if (
            SpeechRecognition
        ) {

            recognition =
                new SpeechRecognition();


            recognition.continuous =
                false;


            recognition.interimResults =
                false;


            recognition.lang =
                "en-IN";


            recognition.onstart =
                () => {

                    isListening =
                        true;


                    body.classList.add(
                        "listening"
                    );


                    statusText.textContent =
                        "LISTENING";

                };


            recognition.onresult =
                event => {

                    const transcript =
                        event.results[0][0]
                            .transcript;


                    commandInput.value =
                        transcript;


                    isListening =
                        false;


                    body.classList.remove(
                        "listening"
                    );


                    sendCommand(
                        transcript
                    );

                };


            recognition.onerror =
                event => {

                    console.warn(
                        "Speech recognition:",
                        event.error
                    );


                    isListening =
                        false;


                    body.classList.remove(
                        "listening"
                    );


                    statusText.textContent =
                        currentMode ===
                        "NO_LIMITS"

                            ? "HIGH ALERT"

                            : "EON ONLINE";

                };


            recognition.onend =
                () => {

                    isListening =
                        false;


                    body.classList.remove(
                        "listening"
                    );


                    if (
                        currentMode ===
                        "NORMAL"
                    ) {

                        statusText.textContent =
                            "EON ONLINE";

                    }

                };

        } else {

            micButton.style.opacity =
                "0.35";


            micButton.title =
                "Speech recognition unavailable";

        }



        /* =========================================================
           MICROPHONE
        ========================================================= */

        micButton.addEventListener(
            "click",
            () => {

                try {

                    getEONAudio();

                } catch (_) {}


                if (
                    !recognition
                ) {

                    showResponse(
                        "Voice recognition is not supported by this browser."
                    );


                    return;

                }


                if (
                    isListening
                ) {

                    recognition.stop();

                    return;

                }


                try {

                    recognition.start();

                } catch (error) {

                    console.warn(
                        error
                    );

                }

            }
        );



        /* =========================================================
           STATUS
        ========================================================= */

        statusButton.addEventListener(
            "click",
            async () => {

                statusText.textContent =
                    "CHECKING SYSTEM";


                try {

                    const response =
                        await fetch(
                            "/api/status",
                            {
                                cache:
                                    "no-store"
                            }
                        );


                    const data =
                        await response.json();


                    if (
                        response.ok &&
                        data.success
                    ) {

                        showResponse(
                            "EON Core is ONLINE."
                        );


                        statusText.textContent =
                            currentMode ===
                            "NO_LIMITS"

                                ? "HIGH ALERT"

                                : "EON ONLINE";

                    } else {

                        showResponse(
                            data.error ||
                            "EON Core returned an error."
                        );


                        statusText.textContent =
                            "SYSTEM ERROR";

                    }

                } catch (error) {

                    console.error(
                        error
                    );


                    showResponse(
                        "EON Core is unreachable."
                    );


                    statusText.textContent =
                        "OFFLINE";

                }

            }
        );



        /* =========================================================
           RESET
        ========================================================= */

        resetButton.addEventListener(
            "click",
            async () => {

                try {

                    const response =
                        await fetch(
                            "/api/reset",
                            {
                                method:
                                    "POST"
                            }
                        );


                    const data =
                        await response.json();


                    if (
                        response.ok &&
                        data.success
                    ) {

                        setMode(
                            "NORMAL"
                        );


                        showResponse(
                            "EON session reset."
                        );


                        statusText.textContent =
                            "EON ONLINE";

                    } else {

                        showResponse(
                            data.error ||
                            "Unable to reset EON."
                        );

                    }

                } catch (error) {

                    console.error(
                        error
                    );


                    showResponse(
                        "Reset request failed."
                    );

                }

            }
        );



        /* =========================================================
           FULLSCREEN
        ========================================================= */

        fullscreenButton.addEventListener(
            "click",
            async () => {

                try {

                    if (
                        !document.fullscreenElement
                    ) {

                        await document
                            .documentElement
                            .requestFullscreen();

                    } else {

                        await document
                            .exitFullscreen();

                    }

                } catch (error) {

                    console.warn(
                        "Fullscreen unavailable:",
                        error
                    );

                }

            }
        );



        /* =========================================================
           CONNECTION
        ========================================================= */

        async function checkConnection() {

            try {

                const response =
                    await fetch(
                        "/health",
                        {
                            cache:
                                "no-store"
                        }
                    );


                if (
                    response.ok
                ) {

                    connection.classList.add(
                        "online"
                    );


                    connection.classList.remove(
                        "offline"
                    );


                    connectionText.textContent =
                        "ONLINE";

                } else {

                    throw new Error(
                        "Offline"
                    );

                }

            } catch (error) {

                connection.classList.remove(
                    "online"
                );


                connection.classList.add(
                    "offline"
                );


                connectionText.textContent =
                    "OFFLINE";

            }

        }



        /* =========================================================
           STARTUP
        ========================================================= */

        checkConnection();


        setInterval(
            checkConnection,
            30000
        );


        currentMode =
            "NORMAL";


        statusText.textContent =
            "EON ONLINE";



        /* =========================================================
           SPACEBAR VOICE
        ========================================================= */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.code ===
                    "Space" &&

                    document.activeElement !==
                    commandInput
                ) {

                    event.preventDefault();

                    micButton.click();

                }

            }
        );

    </script>

</body>

</html>
